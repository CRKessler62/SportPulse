<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SportPulse Game Center</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f6f8;
    color: #111827;
}

.header {
    background: #111827;
    color: white;
    padding: 22px 16px;
    text-align: center;
}

.logo {
    font-size: 34px;
    font-weight: 800;
    margin-bottom: 20px;
}

nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
}

nav a {
    background: #1f2937;
    color: white;
    text-decoration: none;
    padding: 12px 16px;
    border-radius: 12px;
    font-weight: 700;
}

nav a:hover {
    background: #374151;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 30px 16px 60px;
}

.back {
    display: inline-block;
    margin-bottom: 20px;
    color: #2563eb;
    text-decoration: none;
    font-weight: 700;
}

.game-header {
    background: white;
    border-radius: 20px;
    padding: 30px 20px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.league {
    color: #6b7280;
    font-weight: 700;
    margin-bottom: 10px;
}

.status {
    font-size: 18px;
    font-weight: 800;
    margin-bottom: 25px;
}

.live {
    color: #dc2626;
}

.final {
    color: #16a34a;
}

.team {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 650px;
    margin: 12px auto;
    font-size: 26px;
    font-weight: 800;
}

.score {
    font-size: 34px;
}

.inning {
    margin-top: 25px;
    font-size: 20px;
    font-weight: 800;
}

.game-info {
    background: white;
    border-radius: 18px;
    padding: 25px;
    margin-top: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,.06);
}

.game-info h2 {
    margin-top: 0;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.info-box {
    background: #f4f6f8;
    border-radius: 14px;
    padding: 18px;
}

.info-label {
    color: #6b7280;
    font-size: 14px;
    margin-bottom: 7px;
}

.info-value {
    font-size: 20px;
    font-weight: 800;
}

.bases {
    display: flex;
    justify-content: center;
    gap: 25px;
    margin-top: 20px;
}

.base {
    width: 55px;
    height: 55px;
    transform: rotate(45deg);
    border: 3px solid #9ca3af;
    background: white;
}

.base.occupied {
    background: #2563eb;
    border-color: #2563eb;
}

.base-label {
    text-align: center;
    margin-top: 35px;
    font-size: 13px;
    font-weight: 700;
}

.linescore {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    min-width: 650px;
}

th {
    background: #111827;
    color: white;
    padding: 12px 8px;
}

td {
    padding: 12px 8px;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
}

td:first-child,
th:first-child {
    text-align: left;
}

.stats-table {
    overflow-x: auto;
}

.play {
    background: white;
    border-left: 4px solid #2563eb;
    padding: 16px;
    margin-bottom: 10px;
    border-radius: 8px;
}

.loading {
    background: white;
    padding: 30px;
    border-radius: 18px;
    text-align: center;
    color: #6b7280;
}

.error {
    background: white;
    padding: 30px;
    border-radius: 18px;
    text-align: center;
    color: #dc2626;
}

footer {
    background: #111827;
    color: #9ca3af;
    text-align: center;
    padding: 35px 20px;
}

@media(max-width:600px) {

    .team {
        font-size: 20px;
    }

    .score {
        font-size: 28px;
    }

    .info-grid {
        grid-template-columns: 1fr;
    }

}

</style>

</head>


<body>


<header class="header">

<div class="logo">
SportPulse
</div>

<nav>

<a href="index.html">🏠 Home</a>

<a href="mlb.html">⚾ MLB</a>

<a href="nfl.html">🏈 NFL</a>

<a href="nba.html">🏀 NBA</a>

<a href="nhl.html">🏒 NHL</a>

<a href="mls.html">⚽ MLS</a>

</nav>

</header>


<main class="container">


<a href="mlb.html" class="back">
← Back to MLB
</a>


<div id="game">

<div class="loading">
Loading game...
</div>

</div>


</main>


<footer>

<strong>SportPulse</strong>

<br><br>

MLB Game Center

</footer>


<script>


/*
==================================================
GET GAME ID FROM URL
==================================================
*/

const params =
    new URLSearchParams(
        window.location.search
    );


const gamePk =
    params.get("gamePk");


/*
==================================================
CHECK GAME ID
==================================================
*/

if (!gamePk) {

    document.getElementById("game").innerHTML = `

        <div class="error">

            No MLB game was selected.

            <br><br>

            Please return to the MLB page.

        </div>

    `;

}


/*
==================================================
LOAD GAME
==================================================
*/

async function loadGame() {

    if (!gamePk) {
        return;
    }


    try {

        /*
        MLB LIVE GAME FEED
        */

        const response =
            await fetch(
                "https://statsapi.mlb.com/api/v1.1/game/" +
                gamePk +
                "/feed/live"
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load MLB game."
            );

        }


        const data =
            await response.json();


        renderGame(data);


    }

    catch(error) {

        console.error(error);


        document.getElementById(
            "game"
        ).innerHTML = `

            <div class="error">

                Unable to load this game.

                <br><br>

                Please try again.

            </div>

        `;

    }

}


/*
==================================================
RENDER GAME
==================================================
*/

function renderGame(data) {


    const game =
        data.gameData;


    const live =
        data.liveData;


    const teams =
        game.teams;


    const linescore =
        live.linescore;


    const boxscore =
        live.boxscore;


    /*
    TEAM NAMES
    */

    const awayTeam =
        teams.away.name;


    const homeTeam =
        teams.home.name;


    /*
    SCORES
    */

    const awayScore =
        linescore.teams.away.runs || 0;


    const homeScore =
        linescore.teams.home.runs || 0;


    /*
    STATUS
    */

    const status =
        game.status.detailedState;


    /*
    INNING
    */

    const inning =
        linescore.currentInning || "";


    const inningOrdinal =
        linescore.currentInningOrdinal || "";


    const inningState =
        linescore.inningState || "";


    /*
    OUTS
    */

    const outs =
        linescore.outs ?? 0;


    /*
    CURRENT OFFENSE
    */

    const offense =
        linescore.offense || {};


    /*
    CURRENT BATTER
    */

    let batter =
        "—";


    if (offense.batter) {

        batter =
            offense.batter.fullName ||
            "—";

    }


    /*
    CURRENT PITCHER

    */

    let pitcher =
        "—";


    if (linescore.pitcher) {

        pitcher =
            linescore.pitcher.fullName ||
            "—";

    }


    /*
    RUNNERS
    */

    const runnerFirst =
        !!offense.first;


    const runnerSecond =
        !!offense.second;


    const runnerThird =
        !!offense.third;


    /*
    CURRENT PLAY
    */

    let currentPlay =
        "No current play available.";


    if (
        live.plays &&
        live.plays.currentPlay
    ) {

        currentPlay =
            live.plays.currentPlay.result.description ||
            "No current play available.";

    }


    /*
    BUILD PAGE
    */

    let html = `


    <div class="game-header">

        <div class="league">
            ⚾ MLB GAME CENTER
        </div>


        <div class="status ${
            status.toLowerCase().includes("progress")
            ? "live"
            : ""
        }">

            ${
                status.toLowerCase().includes("progress")
                ? "🔴 "
                : ""
            }

            ${status}

        </div>


        <div class="team">

            <span>
                ${awayTeam}
            </span>

            <span class="score">
                ${awayScore}
            </span>

        </div>


        <div class="team">

            <span>
                ${homeTeam}
            </span>

            <span class="score">
                ${homeScore}
            </span>

        </div>


        ${
            inning
            ? `
                <div class="inning">

                    ${inningState || ""}

                    ${inningOrdinal || inning}

                </div>
            `
            : ""
        }

    </div>


    `;


    /*
    LIVE GAME INFORMATION
    */

    if (
        status.toLowerCase().includes("progress")
    ) {

        html += `

        <div class="game-info">

            <h2>
                ⚾ Current At-Bat
            </h2>


            <div class="info-grid">


                <div class="info-box">

                    <div class="info-label">
                        BATTER
                    </div>

                    <div class="info-value">
                        ${batter}
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        PITCHER
                    </div>

                    <div class="info-value">
                        ${pitcher}
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        OUTS
                    </div>

                    <div class="info-value">
                        ${outs}
                    </div>

                </div>


            </div>


            <h3>
                🏃 Runners
            </h3>


            <div class="bases">

                <div>

                    <div class="base ${
                        runnerSecond
                        ? "occupied"
                        : ""
                    }"></div>

                    <div class="base-label">
                        2nd
                    </div>

                </div>


                <div>

                    <div class="base ${
                        runnerThird
                        ? "occupied"
                        : ""
                    }"></div>

                    <div class="base-label">
                        3rd
                    </div>

                </div>


                <div>

                    <div class="base ${
                        runnerFirst
                        ? "occupied"
                        : ""
                    }"></div>

                    <div class="base-label">
                        1st
                    </div>

                </div>

            </div>


            <h3>
                📋 Current Play
            </h3>


            <div class="play">

                ${currentPlay}

            </div>

        </div>

        `;

    }


    /*
    LINESCORE
    */

    html += `

    <div class="game-info">

        <h2>
            📊 Linescore
        </h2>

        <div class="linescore">

            <table>

                <thead>

                    <tr>

                        <th>Team</th>

    `;


    const innings =
        linescore.innings || [];


    innings.forEach(
        inningData => {

            html += `
                <th>
                    ${inningData.num}
                </th>
            `;

        }
    );


    html += `

                        <th>R</th>
                        <th>H</th>
                        <th>E</th>

                    </tr>

                </thead>

                <tbody>

    `;


    function makeLine(team) {

        let row = `
            <tr>
                <td>
                    <strong>
                        ${team}
                    </strong>
                </td>
        `;


        innings.forEach(
            inningData => {

                const side =
                    team === awayTeam
                    ? inningData.away
                    : inningData.home;


                row += `
                    <td>
                        ${side.runs ?? 0}
                    </td>
                `;

            }
        );


        const teamData =
            team === awayTeam
            ? linescore.teams.away
            : linescore.teams.home;


        row += `

                <td>
                    ${teamData.runs ?? 0}
                </td>

                <td>
                    ${teamData.hits ?? 0}
                </td>

                <td>
                    ${teamData.errors ?? 0}
                </td>

            </tr>

        `;


        return row;

    }


    html +=
        makeLine(awayTeam);

    html +=
        makeLine(homeTeam);


    html += `

                </tbody>

            </table>

        </div>

    </div>

    `;


    /*
    BOX SCORE
    */

    html += `

    <div class="game-info">

        <h2>
            🏏 Batting
        </h2>

        <div class="stats-table">

            <table>

                <thead>

                    <tr>

                        <th>Player</th>
                        <th>AB</th>
                        <th>R</th>
                        <th>H</th>
                        <th>RBI</th>
                        <th>BB</th>
                        <th>SO</th>

                    </tr>

                </thead>

                <tbody>

    `;


    for (
        const teamId in boxscore.teams
    ) {


        const batting =
            boxscore
                .teams[teamId]
                .players;


        for (
            const playerId in batting
        ) {


            const player =
                batting[playerId];


            const stats =
                player.stats &&
                player.stats.batting;


            if (!stats) {
                continue;
            }


            html += `

                <tr>

                    <td>
                        ${
                            player.person
                            ?.fullName ||
                            "Player"
                        }
                    </td>

                    <td>
                        ${stats.atBats ?? 0}
                    </td>

                    <td>
                        ${stats.runs ?? 0}
                    </td>

                    <td>
                        ${stats.hits ?? 0}
                    </td>

                    <td>
                        ${stats.rbi ?? 0}
                    </td>

                    <td>
                        ${stats.baseOnBalls ?? 0}
                    </td>

                    <td>
                        ${stats.strikeOuts ?? 0}
                    </td>

                </tr>

            `;

        }

    }


    html += `

                </tbody>

            </table>

        </div>

    </div>

    `;


    /*
    PITCHING
    */

    html += `

    <div class="game-info">

        <h2>
            🎯 Pitching
        </h2>

        <div class="stats-table">

            <table>

                <thead>

                    <tr>

                        <th>Pitcher</th>
                        <th>IP</th>
                        <th>H</th>
                        <th>R</th>
                        <th>ER</th>
                        <th>BB</th>
                        <th>SO</th>

                    </tr>

                </thead>

                <tbody>

    `;


    for (
        const teamId in boxscore.teams
    ) {


        const pitching =
            boxscore
                .teams[teamId]
                .players;


        for (
            const playerId in pitching
        ) {


            const player =
                pitching[playerId];


            const stats =
                player.stats &&
                player.stats.pitching;


            if (!stats) {
                continue;
            }


            html += `

                <tr>

                    <td>
                        ${
                            player.person
                            ?.fullName ||
                            "Pitcher"
                        }
                    </td>

                    <td>
                        ${stats.inningsPitched ?? 0}
                    </td>

                    <td>
                        ${stats.hits ?? 0}
                    </td>

                    <td>
                        ${stats.runs ?? 0}
                    </td>

                    <td>
                        ${stats.earnedRuns ?? 0}
                    </td>

                    <td>
                        ${stats.baseOnBalls ?? 0}
                    </td>

                    <td>
                        ${stats.strikeOuts ?? 0}
                    </td>

                </tr>

            `;

        }

    }


    html += `

                </tbody>

            </table>

        </div>

    </div>

    `;


    /*
    PLAY BY PLAY
    */

    html += `

    <div class="game-info">

        <h2>
            📋 Play-by-Play
        </h2>

    `;


    const plays =
        live.plays &&
        live.plays.allPlays
        ? live.plays.allPlays
        : [];


    const recentPlays =
        plays.slice(-30).reverse();


    if (recentPlays.length === 0) {

        html += `
            <p>
                Play-by-play unavailable.
            </p>
        `;

    } else {

        recentPlays.forEach(play => {

            html += `

                <div class="play">

                    ${
                        play.result
                        ?.description ||
                        "Play"
                    }

                </div>

            `;

        });

    }


    html += `

    </div>

    `;


    document.getElementById(
        "game"
    ).innerHTML = html;

}


/*
==================================================
INITIAL LOAD
==================================================
*/

loadGame();


/*
==================================================
REFRESH LIVE GAME
==================================================
*/

setInterval(
    loadGame,
    30000
);

</script>

</body>

</html>
