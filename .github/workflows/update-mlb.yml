name: Update MLB Standings

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-mlb:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SportPulse
        uses: actions/checkout@v4

      - name: Get MLB standings
        run: |
          python - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone

          url = (
              "https://statsapi.mlb.com/api/v1/standings"
              "?leagueId=103,104"
              "&season=2026"
              "&standingsTypes=regularSeason"
          )

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "SportPulse/1.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = json.load(response)

          teams = []

          for record in data.get("records", []):
              division = record.get("division", {})
              division_name = division.get("name", "")

              league = record.get("league", {})
              league_name = league.get("name", "")

              for team_record in record.get("teamRecords", []):
                  team = team_record.get("team", {})

                  teams.append({
                      "id": team.get("id"),
                      "name": team.get("name"),
                      "abbreviation": team.get("abbreviation"),
                      "league": league_name,
                      "division": division_name,
                      "wins": team_record.get("wins"),
                      "losses": team_record.get("losses"),
                      "winPct": team_record.get("winningPercentage"),
                      "gamesBack": team_record.get("gamesBack"),
                      "divisionRank": team_record.get("divisionRank"),
                      "leagueRank": team_record.get("leagueRank"),
                      "wildCardGamesBack": team_record.get("wildCardGamesBack"),
                      "streak": team_record.get("streak", {}).get("streakCode"),
                      "lastTen": team_record.get("records", {}).get("splitRecords", [])
                  })

          output = {
              "league": "MLB",
              "season": 2026,
              "lastUpdated": datetime.now(timezone.utc).isoformat(),
              "teamCount": len(teams),
              "teams": teams
          }

          with open("data/standings.json", "w") as file:
              json.dump(output, file, indent=2)

          print(f"Updated {len(teams)} MLB teams.")
          PY

      - name: Save updated standings
        run: |
          git config user.name "SportPulse Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/standings.json

          git diff --cached --quiet || git commit -m "Update MLB standings"

          git push
