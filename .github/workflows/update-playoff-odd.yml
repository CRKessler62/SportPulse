name: Update MLB Playoff Odds

on:
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"

permissions:
  contents: write

jobs:
  playoff-odds:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get MLB Standings
        run: |

          python3 <<'PY'

          import json
          import urllib.request
          import os
          from datetime import datetime, timezone

          URL = (
              "https://statsapi.mlb.com/api/v1/standings"
              "?leagueId=103,104"
              "&season=2026"
              "&standingsTypes=regularSeason"
          )

          print("Getting MLB standings...")

          request = urllib.request.Request(
              URL,
              headers={
                  "User-Agent": "SportPulse/1.0"
              }
          )

          with urllib.request.urlopen(
              request,
              timeout=30
          ) as response:

              data = json.load(response)

          teams = []

          for record in data.get("records", []):

              league_id = record.get(
                  "league",
                  {}
              ).get("id")

              division = record.get(
                  "division",
                  {}
              )

              division_name = division.get(
                  "nameShort",
                  ""
              )

              for item in record.get(
                  "teamRecords",
                  []
              ):

                  team = item.get(
                      "team",
                      {}
                  )

                  team_id = team.get("id")

                  name = team.get(
                      "name",
                      "Unknown"
                  )

                  wins = item.get(
                      "wins",
                      0
                  )

                  losses = item.get(
                      "losses",
                      0
                  )

                  games = wins + losses

                  if games > 0:
                      win_pct = wins / games
                  else:
                      win_pct = 0.500

                  if league_id == 103:
                      league = "AL"
                  else:
                      league = "NL"

                  teams.append({

                      "teamId": team_id,

                      "team": name,

                      "league": league,

                      "division": division_name,

                      "wins": wins,

                      "losses": losses,

                      "winPercentage": round(
                          win_pct,
                          3
                      )

                  })


          print(
              "Teams found:",
              len(teams)
          )

          if len(teams) != 30:

              raise Exception(
                  "MLB standings did not return "
                  "30 teams."
              )


          # =========================================
          # SPORTPULSE PLAYOFF PROJECTION
          # =========================================

          for team in teams:

              pct = team[
                  "winPercentage"
              ]

              probability = (
                  50
                  +
                  (
                      pct - 0.500
                  ) * 250
              )

              probability = max(
                  1,
                  min(
                      99,
                      probability
                  )
              )

              team[
                  "playoffProbability"
              ] = round(
                  probability,
                  1
              )

              team[
                  "divisionProbability"
              ] = round(
                  min(
                      99,
                      probability + 5
                  ),
                  1
              )

              team[
                  "wildCardProbability"
              ] = round(
                  min(
                      99,
                      probability * 0.65
                  ),
                  1
              )

              team[
                  "missProbability"
              ] = round(
                  100 - probability,
                  1
              )


              if probability >= 90:

                  team[
                      "status"
                  ] = "Very strong position"

                  team[
                      "whatTheyNeed"
                  ] = (
                      "Maintain their current "
                      "pace and avoid a major collapse."
                  )


              elif probability >= 75:

                  team[
                      "status"
                  ] = "Strong position"

                  team[
                      "whatTheyNeed"
                  ] = (
                      "Continue winning games and "
                      "stay above the playoff line."
                  )


              elif probability >= 50:

                  team[
                      "status"
                  ] = "In the hunt"

                  team[
                      "whatTheyNeed"
                  ] = (
                      "Keep winning and improve "
                      "their position in the standings."
                  )


              elif probability >= 25:

                  team[
                      "status"
                  ] = "Bubble team"

                  team[
                      "whatTheyNeed"
                  ] = (
                      "They need a strong finish "
                      "and some help from other teams."
                  )


              else:

                  team[
                      "status"
                  ] = "Long shot"

                  team[
                      "whatTheyNeed"
                  ] = (
                      "They need a major turnaround "
                      "and significant help from other teams."
                  )


          # =========================================
          # SORT BY LEAGUE AND PLAYOFF ODDS
          # =========================================

          teams.sort(
              key=lambda x: (
                  x["league"],
                  -x["playoffProbability"]
              )
          )


          # =========================================
          # CREATE OUTPUT
          # =========================================

          output = {

              "season": 2026,

              "lastUpdated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "method":
                  "SportPulse playoff projection "
                  "based on current winning percentage.",

              "note":
                  "These are SportPulse projections, "
                  "not official MLB playoff odds.",

              "teams": teams

          }


          # =========================================
          # SAVE FILE
          # =========================================

          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/playoff_odds.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2
              )


          print("")
          print("==============================")
          print("PLAYOFF ODDS CREATED")
          print("==============================")
          print(
              "Teams:",
              len(teams)
          )
          print("==============================")


          PY


      - name: Save data
        run: |

          git config user.name "SportPulse Bot"

          git config user.email "sportpulse-bot@users.noreply.github.com"

          git add data/playoff_odds.json

          git diff --cached --quiet || \
            git commit -m "Update MLB playoff odds"

          echo "Updating local branch..."

          git pull --rebase origin main

          echo "Pushing playoff odds..."

          git push origin main
