name: Update MLB League Leaders

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-leaders:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build AL and NL League Leaders
        run: |

          python3 <<'PY'

          import json
          import urllib.request
          import urllib.parse
          import os
          from datetime import datetime, timezone


          SEASON = "2026"


          LEAGUES = {
              "AL": "103",
              "NL": "104"
          }


          def get_leaders(
              category,
              league_id,
              stat_group=None,
              exclude_pitchers=False
          ):

              if exclude_pitchers:
                  limit = 50
              else:
                  limit = 5


              params = {
                  "leaderCategories": category,
                  "season": SEASON,
                  "sportId": "1",
                  "leagueId": league_id,
                  "limit": limit,
                  "hydrate": "person,team"
              }


              if stat_group:
                  params["statGroup"] = stat_group


              url = (
                  "https://statsapi.mlb.com/api/v1/stats/leaders?"
                  + urllib.parse.urlencode(params)
              )


              print(
                  "Loading:",
                  category,
                  "League:",
                  league_id
              )


              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "SportPulse/1.0"
                  }
              )


              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  data = json.load(response)


              league_leaders = data.get(
                  "leagueLeaders",
                  []
              )


              if not league_leaders:
                  print(
                      "No data returned for",
                      category
                  )
                  return []


              leaders = league_leaders[0].get(
                  "leaders",
                  []
              )


              results = []


              for leader in leaders:

                  person = leader.get(
                      "person",
                      {}
                  )


                  team = leader.get(
                      "team",
                      {}
                  )


                  # -----------------------------
                  # EXCLUDE PITCHERS
                  # -----------------------------

                  if exclude_pitchers:

                      position = person.get(
                          "primaryPosition",
                          {}
                      )


                      abbreviation = position.get(
                          "abbreviation",
                          ""
                      )


                      position_name = position.get(
                          "name",
                          ""
                      )


                      if (
                          abbreviation == "P"
                          or
                          position_name == "Pitcher"
                      ):
                          continue


                  results.append({

                      "rank": len(results) + 1,

                      "player": person.get(
                          "fullName",
                          "Unknown"
                      ),

                      "team": team.get(
                          "name",
                          "Unknown"
                      ),

                      "value": leader.get(
                          "value",
                          ""
                      )

                  })


                  if len(results) >= 5:
                      break


              print(
                  category,
                  "returned",
                  len(results),
                  "players"
              )


              return results


          # =========================================
          # OFFENSE
          # =========================================

          OFFENSE = {

              "battingAverage": (
                  "battingAverage",
                  "hitting"
              ),

              "hits": (
                  "hits",
                  "hitting"
              ),

              "homeRuns": (
                  "homeRuns",
                  "hitting"
              ),

              "rbi": (
                  "rbi",
                  "hitting"
              ),

              "runs": (
                  "runs",
                  "hitting"
              ),

              "obp": (
                  "onBasePercentage",
                  "hitting"
              ),

              "slg": (
                  "sluggingPercentage",
                  "hitting"
              ),

              "ops": (
                  "onBasePlusSlugging",
                  "hitting"
              ),

              "stolenBases": (
                  "stolenBases",
                  None
              ),

              "doubles": (
                  "doubles",
                  "hitting"
              ),

              "triples": (
                  "triples",
                  "hitting"
              )

          }


          # =========================================
          # PITCHING
          # =========================================

          PITCHING = {

              "era": (
                  "era",
                  "pitching"
              ),

              "wins": (
                  "wins",
                  "pitching"
              ),

              "strikeouts": (
                  "strikeouts",
                  "pitching"
              ),

              "whip": (
                  "whip",
                  "pitching"
              ),

              "saves": (
                  "saves",
                  "pitching"
              ),

              "innings": (
                  "inningsPitched",
                  "pitching"
              ),

              "qualityStarts": (
                  "qualityStarts",
                  "pitching"
              )

          }


          # =========================================
          # DEFENSE
          # =========================================

          DEFENSE = {

              "fieldingPercentage": (
                  "fieldingPercentage",
                  "fielding"
              ),

              "putouts": (
                  "putouts",
                  "fielding"
              ),

              "assists": (
                  "assists",
                  "fielding"
              ),

              "errors": (
                  "errors",
                  "fielding"
              ),

              "doublePlays": (
                  "doublePlays",
                  "fielding"
              )

          }


          # =========================================
          # BUILD ONE LEAGUE
          # =========================================

          def build_league(league_id):

              league_data = {

                  "offense": {},

                  "pitching": {},

                  "defense": {},

                  "defenseNote":
                      "Pitchers are excluded from all defensive statistics."

              }


              print("")
              print(
                  "=============================="
              )

              print(
                  "Building league:",
                  league_id
              )

              print(
                  "=============================="
              )


              # -----------------------------
              # OFFENSE
              # -----------------------------

              for name, settings in OFFENSE.items():

                  try:

                      league_data["offense"][name] = (
                          get_leaders(
                              settings[0],
                              league_id,
                              settings[1]
                          )
                      )

                  except Exception as error:

                      print(
                          "ERROR:",
                          name,
                          error
                      )

                      league_data["offense"][name] = []


              # -----------------------------
              # PITCHING
              # -----------------------------

              for name, settings in PITCHING.items():

                  try:

                      league_data["pitching"][name] = (
                          get_leaders(
                              settings[0],
                              league_id,
                              settings[1]
                          )
                      )

                  except Exception as error:

                      print(
                          "ERROR:",
                          name,
                          error
                      )

                      league_data["pitching"][name] = []


              # -----------------------------
              # DEFENSE
              # -----------------------------

              for name, settings in DEFENSE.items():

                  try:

                      league_data["defense"][name] = (
                          get_leaders(
                              settings[0],
                              league_id,
                              settings[1],
                              True
                          )
                      )

                  except Exception as error:

                      print(
                          "ERROR:",
                          name,
                          error
                      )

                      league_data["defense"][name] = []


              return league_data


          # =========================================
          # BUILD AL
          # =========================================

          print("")
          print(
              "BUILDING AMERICAN LEAGUE"
          )


          AL = build_league(
              LEAGUES["AL"]
          )


          # =========================================
          # BUILD NL
          # =========================================

          print("")
          print(
              "BUILDING NATIONAL LEAGUE"
          )


          NL = build_league(
              LEAGUES["NL"]
          )


          # =========================================
          # CREATE JSON
          # =========================================

          output = {

              "season": 2026,

              "lastUpdated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "leagues": {

                  "AL": AL,

                  "NL": NL

              }

          }


          # =========================================
          # SAVE FILE
          # =========================================

          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/leaders.json",
              "w"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2
              )


          # =========================================
          # VALIDATE
          # =========================================

          total = 0


          for league in [
              AL,
              NL
          ]:

              for section in [
                  "offense",
                  "pitching",
                  "defense"
              ]:

                  for players in league[section].values():

                      total += len(players)


          print("")
          print(
              "=============================="
          )

          print(
              "TOTAL LEADER RECORDS:",
              total
          )

          print(
              "=============================="
          )


          print("")
          print(
              "Pitchers excluded from defense:"
          )

          print(
              "YES"
          )


          print("")
          print(
              "AL STOLEN BASE LEADERS:"
          )


          for player in AL["offense"]["stolenBases"]:

              print(
                  player["rank"],
                  player["player"],
                  player["team"],
                  player["value"]
              )


          print("")
          print(
              "NL STOLEN BASE LEADERS:"
          )


          for player in NL["offense"]["stolenBases"]:

              print(
                  player["rank"],
                  player["player"],
                  player["team"],
                  player["value"]
              )


          if total == 0:

              raise Exception(
                  "No MLB leader data was returned."
              )


          PY


      - name: Save updated leaders
        run: |

          git config user.name \
            "SportPulse Bot"

          git config user.email \
            "sportpulse-bot@users.noreply.github.com"

          git add data/leaders.json

          git diff --cached --quiet || \
            git commit -m \
            "Update AL NL MLB league leaders"

          git push
