name: Update MLB League Leaders

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-leaders:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Get MLB league leaders
        run: |

          python3 <<'PY'

          import json
          import urllib.request
          import urllib.parse
          import os
          from datetime import datetime, timezone


          SEASON = "2026"


          def get_group_stats(group):

              params = {
                  "stats": "season",
                  "group": group,
                  "season": SEASON,
                  "gameType": "R",
                  "sportIds": "1",
                  "limit": "1000",
                  "hydrate": "person,team"
              }

              url = (
                  "https://statsapi.mlb.com/api/v1/stats?"
                  + urllib.parse.urlencode(params)
              )

              print("Downloading:")
              print(url)

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "SportPulse/1.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  data = json.load(response)

              return data.get("stats", [])


          def number(value):

              try:
                  return float(value)
              except:
                  return 0


          def make_leader_list(
              stats,
              stat_name,
              reverse=True
          ):

              players = []

              for item in stats:

                  stat = item.get(
                      "stat",
                      {}
                  )

                  value = stat.get(
                      stat_name
                  )

                  if value is None:
                      continue

                  person = item.get(
                      "player",
                      {}
                  )

                  team = item.get(
                      "team",
                      {}
                  )

                  players.append({

                      "player":
                          person.get(
                              "fullName",
                              "Unknown"
                          ),

                      "team":
                          team.get(
                              "name",
                              "Unknown"
                          ),

                      "value":
                          value,

                      "_sort":
                          number(value)

                  })


              players.sort(
                  key=lambda x: x["_sort"],
                  reverse=reverse
              )


              return [

                  {
                      "player": player["player"],
                      "team": player["team"],
                      "value": player["value"]
                  }

                  for player in players[:5]

              ]


          print("Getting hitting statistics...")

          hitting = get_group_stats("hitting")

          print(
              "Hitting records:",
              len(hitting)
          )


          print("Getting pitching statistics...")

          pitching = get_group_stats("pitching")

          print(
              "Pitching records:",
              len(pitching)
          )


          print("Getting fielding statistics...")

          fielding = get_group_stats("fielding")

          print(
              "Fielding records:",
              len(fielding)
          )


          data = {

              "season": 2026,

              "lastUpdated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),


              "offense": {

                  "battingAverage":
                      make_leader_list(
                          hitting,
                          "avg"
                      ),

                  "hits":
                      make_leader_list(
                          hitting,
                          "hits"
                      ),

                  "homeRuns":
                      make_leader_list(
                          hitting,
                          "homeRuns"
                      ),

                  "rbi":
                      make_leader_list(
                          hitting,
                          "rbi"
                      ),

                  "runs":
                      make_leader_list(
                          hitting,
                          "runs"
                      ),

                  "obp":
                      make_leader_list(
                          hitting,
                          "obp"
                      ),

                  "slg":
                      make_leader_list(
                          hitting,
                          "slg"
                      ),

                  "ops":
                      make_leader_list(
                          hitting,
                          "ops"
                      ),

                  "stolenBases":
                      make_leader_list(
                          hitting,
                          "stolenBases"
                      ),

                  "doubles":
                      make_leader_list(
                          hitting,
                          "doubles"
                      ),

                  "triples":
                      make_leader_list(
                          hitting,
                          "triples"
                      )

              },


              "pitching": {

                  "era":
                      make_leader_list(
                          pitching,
                          "era",
                          False
                      ),

                  "wins":
                      make_leader_list(
                          pitching,
                          "wins"
                      ),

                  "strikeouts":
                      make_leader_list(
                          pitching,
                          "strikeOuts"
                      ),

                  "whip":
                      make_leader_list(
                          pitching,
                          "whip",
                          False
                      ),

                  "saves":
                      make_leader_list(
                          pitching,
                          "saves"
                      ),

                  "innings":
                      make_leader_list(
                          pitching,
                          "inningsPitched"
                      ),

                  "qualityStarts":
                      make_leader_list(
                          pitching,
                          "qualityStarts"
                      )

              },


              "defense": {

                  "fieldingPercentage":
                      make_leader_list(
                          fielding,
                          "fielding"
                      ),

                  "putouts":
                      make_leader_list(
                          fielding,
                          "putOuts"
                      ),

                  "assists":
                      make_leader_list(
                          fielding,
                          "assists"
                      ),

                  "errors":
                      make_leader_list(
                          fielding,
                          "errors",
                          False
                      ),

                  "doublePlays":
                      make_leader_list(
                          fielding,
                          "doublePlays"
                      )

              }

          }


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/leaders.json",
              "w"
          ) as file:

              json.dump(
                  data,
                  file,
                  indent=2
              )


          total = 0

          for group in [
              "offense",
              "pitching",
              "defense"
          ]:

              for category in data[group]:

                  total += len(
                      data[group][category]
                  )


          print("")
          print("==============================")
          print(
              "TOTAL LEADER RECORDS:",
              total
          )
          print("==============================")
          print("")


          if total == 0:

              raise Exception(
                  "No MLB leader data was returned."
              )

          PY


      - name: Save updated leaders
        run: |

          git config user.name \
            "SportPulse Bot"

          git config user.email \
            "sportpulse-bot@users.noreply.github.com"

          git add data/leaders.json

          git diff --cached --quiet || \
            git commit -m \
            "Update MLB league leaders"

          git push
