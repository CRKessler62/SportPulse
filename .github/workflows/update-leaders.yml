name: Update MLB League Leaders

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-leaders:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Download MLB leader data
        run: |

          python3 <<'PY'

          import json
          import urllib.request
          from datetime import datetime, timezone
          from urllib.parse import urlencode


          SEASON = 2026


          def get_stats(group, stat):

              params = urlencode({
                  "stats": "season",
                  "group": group,
                  "season": SEASON,
                  "gameType": "R",
                  "sportIds": "1",
                  "limit": "1000",
                  "hydrate": "team,person"
              })


              url = (
                  "https://statsapi.mlb.com/api/v1/stats?"
                  + params
              )


              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "SportPulse/1.0"
                  }
              )


              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  data = json.load(response)


              results = []


              for item in data.get("stats", []):

                  stat_data = item.get(
                      "stat",
                      {}
                  )


                  player = item.get(
                      "player",
                      {}
                  )


                  team = item.get(
                      "team",
                      {}
                  )


                  value = stat_data.get(stat)


                  if value is None:
                      continue


                  try:

                      numeric_value = float(value)

                  except:

                      continue


                  results.append({

                      "player":
                          player.get(
                              "fullName",
                              "Unknown"
                          ),

                      "team":
                          team.get(
                              "name",
                              "Unknown"
                          ),

                      "value":
                          value,

                      "_sort":
                          numeric_value

                  })


              return results


          def leaders(
              group,
              stat,
              reverse=True
          ):

              players = get_stats(
                  group,
                  stat
              )


              players.sort(
                  key=lambda x:
                      x["_sort"],
                  reverse=reverse
              )


              output = []


              for player in players[:5]:

                  output.append({

                      "player":
                          player["player"],

                      "team":
                          player["team"],

                      "value":
                          player["value"]

                  })


              return output


          data = {

              "season": SEASON,

              "lastUpdated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),


              "offense": {

                  "battingAverage":
                      leaders(
                          "hitting",
                          "avg"
                      ),

                  "hits":
                      leaders(
                          "hitting",
                          "hits"
                      ),

                  "homeRuns":
                      leaders(
                          "hitting",
                          "homeRuns"
                      ),

                  "rbi":
                      leaders(
                          "hitting",
                          "rbi"
                      ),

                  "runs":
                      leaders(
                          "hitting",
                          "runs"
                      ),

                  "obp":
                      leaders(
                          "hitting",
                          "obp"
                      ),

                  "slg":
                      leaders(
                          "hitting",
                          "slg"
                      ),

                  "ops":
                      leaders(
                          "hitting",
                          "ops"
                      ),

                  "stolenBases":
                      leaders(
                          "hitting",
                          "stolenBases"
                      ),

                  "doubles":
                      leaders(
                          "hitting",
                          "doubles"
                      ),

                  "triples":
                      leaders(
                          "hitting",
                          "triples"
                      )

              },


              "pitching": {

                  "era":
                      leaders(
                          "pitching",
                          "era",
                          False
                      ),

                  "wins":
                      leaders(
                          "pitching",
                          "wins"
                      ),

                  "strikeouts":
                      leaders(
                          "pitching",
                          "strikeOuts"
                      ),

                  "whip":
                      leaders(
                          "pitching",
                          "whip",
                          False
                      ),

                  "saves":
                      leaders(
                          "pitching",
                          "saves"
                      ),

                  "innings":
                      leaders(
                          "pitching",
                          "inningsPitched"
                      ),

                  "qualityStarts":
                      leaders(
                          "pitching",
                          "qualityStarts"
                      )

              },


              "defense": {

                  "fieldingPercentage":
                      leaders(
                          "fielding",
                          "fielding"
                      ),

                  "putouts":
                      leaders(
                          "fielding",
                          "putOuts"
                      ),

                  "assists":
                      leaders(
                          "fielding",
                          "assists"
                      ),

                  "errors":
                      leaders(
                          "fielding",
                          "errors",
                          False
                      ),

                  "doublePlays":
                      leaders(
                          "fielding",
                          "doublePlays"
                      )

              }

          }


          # Make sure the data directory exists.

          import os

          os.makedirs(
              "data",
              exist_ok=True
          )


          # Save the file.

          with open(
              "data/leaders.json",
              "w"
          ) as file:

              json.dump(
                  data,
                  file,
                  indent=2
              )


          # Print a diagnostic message.

          total = 0

          for group in [
              "offense",
              "pitching",
              "defense"
          ]:

              for category in data[group].values():

                  total += len(category)


          print(
              f"Created {total} leader records."
          )


          if total == 0:

              raise Exception(
                  "MLB API returned no leader data."
              )

          PY


      - name: Save MLB leaders
        run: |

          git config user.name \
            "SportPulse Bot"

          git config user.email \
            "sportpulse-bot@users.noreply.github.com"

          git add data/leaders.json

          git diff --cached --quiet || \
            git commit -m \
            "Update MLB league leaders"

          git push
