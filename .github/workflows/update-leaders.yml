name: Update MLB League Leaders

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-leaders:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download MLB leaders
        run: |

          python3 <<'PY'

          import json
          import urllib.request
          import urllib.parse
          import os
          from datetime import datetime, timezone

          SEASON = "2026"


          def get_leaders(category, group):

              params = {
                  "leaderCategories": category,
                  "season": SEASON,
                  "sportId": "1",
                  "statGroup": group,
                  "limit": "5",
                  "hydrate": "person,team"
              }

              url = (
                  "https://statsapi.mlb.com/api/v1/stats/leaders?"
                  + urllib.parse.urlencode(params)
              )

              print("Loading:", category)

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "SportPulse/1.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  data = json.load(response)

              leaders = data.get(
                  "leagueLeaders",
                  []
              )

              if not leaders:
                  print("No data for", category)
                  return []

              rows = leaders[0].get(
                  "leaders",
                  []
              )

              result = []

              for row in rows:

                  person = row.get(
                      "person",
                      {}
                  )

                  team = row.get(
                      "team",
                      {}
                  )

                  result.append({

                      "rank":
                          row.get(
                              "rank",
                              len(result) + 1
                          ),

                      "player":
                          person.get(
                              "fullName",
                              "Unknown"
                          ),

                      "team":
                          team.get(
                              "name",
                              "Unknown"
                          ),

                      "value":
                          row.get(
                              "value",
                              ""
                          )

                  })

              print(
                  category,
                  "returned",
                  len(result),
                  "players"
              )

              return result


          offense_categories = {

              "battingAverage":
                  ("battingAverage", "hitting"),

              "hits":
                  ("hits", "hitting"),

              "homeRuns":
                  ("homeRuns", "hitting"),

              "rbi":
                  ("rbi", "hitting"),

              "runs":
                  ("runs", "hitting"),

              "obp":
                  ("onBasePercentage", "hitting"),

              "slg":
                  ("sluggingPercentage", "hitting"),

              "ops":
                  ("onBasePlusSlugging", "hitting"),

              "stolenBases":
                  ("stolenBases", "running"),

              "doubles":
                  ("doubles", "hitting"),

              "triples":
                  ("triples", "hitting")

          }


          pitching_categories = {

              "era":
                  ("era", "pitching"),

              "wins":
                  ("wins", "pitching"),

              "strikeouts":
                  ("strikeouts", "pitching"),

              "whip":
                  ("whip", "pitching"),

              "saves":
                  ("saves", "pitching"),

              "innings":
                  ("inningsPitched", "pitching"),

              "qualityStarts":
                  ("qualityStarts", "pitching")

          }


          defense_categories = {

              "fieldingPercentage":
                  ("fieldingPercentage", "fielding"),

              "putouts":
                  ("putouts", "fielding"),

              "assists":
                  ("assists", "fielding"),

              "errors":
                  ("errors", "fielding"),

              "doublePlays":
                  ("doublePlays", "fielding")

          }


          offense = {}

          for name, info in offense_categories.items():

              try:

                  offense[name] = get_leaders(
                      info[0],
                      info[1]
                  )

              except Exception as error:

                  print(
                      "ERROR:",
                      name,
                      error
                  )

                  offense[name] = []


          pitching = {}

          for name, info in pitching_categories.items():

              try:

                  pitching[name] = get_leaders(
                      info[0],
                      info[1]
                  )

              except Exception as error:

                  print(
                      "ERROR:",
                      name,
                      error
                  )

                  pitching[name] = []


          defense = {}

          for name, info in defense_categories.items():

              try:

                  defense[name] = get_leaders(
                      info[0],
                      info[1]
                  )

              except Exception as error:

                  print(
                      "ERROR:",
                      name,
                      error
                  )

                  defense[name] = []


          output = {

              "season": 2026,

              "lastUpdated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "offense": offense,

              "pitching": pitching,

              "defense": defense

          }


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/leaders.json",
              "w"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2
              )


          total = 0

          for section in [
              offense,
              pitching,
              defense
          ]:

              for category in section.values():

                  total += len(category)


          print("")
          print("==============================")
          print("TOTAL PLAYERS:", total)
          print("==============================")


          if total == 0:

              raise Exception(
                  "MLB returned zero leader records."
              )

          PY


      - name: Check generated data
        run: |

          echo "Checking leaders.json..."

          python3 - <<'PY'

          import json

          with open(
              "data/leaders.json",
              "r"
          ) as f:

              data = json.load(f)

          print("")
          print(
              "Home Run Leaders:"
          )

          for player in data[
              "offense"
          ][
              "homeRuns"
          ]:

              print(
                  player["rank"],
                  player["player"],
                  "-",
                  player["team"],
                  "-",
                  player["value"]
              )

          PY


      - name: Save updated leaders
        run: |

          git config user.name \
            "SportPulse Bot"

          git config user.email \
            "sportpulse-bot@users.noreply.github.com"

          git add data/leaders.json

          git diff --cached --quiet || \
            git commit -m \
            "Update MLB league leaders"

          git push
