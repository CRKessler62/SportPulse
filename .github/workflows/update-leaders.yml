name: Update MLB League Leaders

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-leaders:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get MLB League Leaders
        run: |

          python3 <<'PY'

          import json
          import urllib.request
          from datetime import datetime, timezone


          SEASON = 2026

          BASE_URL = (
              "https://statsapi.mlb.com/api/v1/stats"
          )


          def get_stats(group, stat):

              params = (
                  f"?stats=season"
                  f"&group={group}"
                  f"&season={SEASON}"
                  f"&gameType=R"
                  f"&sportIds=1"
                  f"&limit=1000"
                  f"&hydrate=team,person"
              )

              url = BASE_URL + params

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "SportPulse MLB"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  data = json.load(response)


              results = []

              for item in data.get("stats", []):

                  stat_data = item.get(
                      "stat",
                      {}
                  )

                  player = item.get(
                      "player",
                      {}
                  )

                  team = item.get(
                      "team",
                      {}
                  )


                  value = stat_data.get(
                      stat
                  )


                  if value is None:
                      continue


                  try:

                      numeric = float(
                          value
                      )

                  except:

                      continue


                  results.append({

                      "player":
                          player.get(
                              "fullName",
                              "Unknown"
                          ),

                      "team":
                          team.get(
                              "name",
                              "Unknown"
                          ),

                      "value":
                          value,

                      "_numeric":
                          numeric

                  })


              return results


          def make_leaders(
              group,
              stat,
              count=5,
              reverse=True
          ):

              players = get_stats(
                  group,
                  stat
              )


              players.sort(
                  key=lambda x:
                      x["_numeric"],
                  reverse=reverse
              )


              leaders = []


              for player in players[:count]:

                  player.pop(
                      "_numeric",
                      None
                  )

                  leaders.append(
                      player
                  )


              return leaders


          leaders = {

              "league": "MLB",

              "season": SEASON,

              "lastUpdated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "offense": {

                  "battingAverage":
                      make_leaders(
                          "hitting",
                          "avg"
                      ),

                  "hits":
                      make_leaders(
                          "hitting",
                          "hits"
                      ),

                  "homeRuns":
                      make_leaders(
                          "hitting",
                          "homeRuns"
                      ),

                  "rbi":
                      make_leaders(
                          "hitting",
                          "rbi"
                      ),

                  "runs":
                      make_leaders(
                          "hitting",
                          "runs"
                      ),

                  "obp":
                      make_leaders(
                          "hitting",
                          "obp"
                      ),

                  "slg":
                      make_leaders(
                          "hitting",
                          "slg"
                      ),

                  "ops":
                      make_leaders(
                          "hitting",
                          "ops"
                      ),

                  "stolenBases":
                      make_leaders(
                          "hitting",
                          "stolenBases"
                      ),

                  "doubles":
                      make_leaders(
                          "hitting",
                          "doubles"
                      ),

                  "triples":
                      make_leaders(
                          "hitting",
                          "triples"
                      )

              },


              "pitching": {

                  "era":
                      make_leaders(
                          "pitching",
                          "era",
                          5,
                          False
                      ),

                  "wins":
                      make_leaders(
                          "pitching",
                          "wins"
                      ),

                  "strikeouts":
                      make_leaders(
                          "pitching",
                          "strikeOuts"
                      ),

                  "whip":
                      make_leaders(
                          "pitching",
                          "whip",
                          5,
                          False
                      ),

                  "saves":
                      make_leaders(
                          "pitching",
                          "saves"
                      ),

                  "innings":
                      make_leaders(
                          "pitching",
                          "inningsPitched"
                      ),

                  "qualityStarts":
                      make_leaders(
                          "pitching",
                          "qualityStarts"
                      )

              },


              "defense": {

                  "fieldingPercentage":
                      make_leaders(
                          "fielding",
                          "fielding",
                          5,
                          True
                      ),

                  "putouts":
                      make_leaders(
                          "fielding",
                          "putOuts"
                      ),

                  "assists":
                      make_leaders(
                          "fielding",
                          "assists"
                      ),

                  "errors":
                      make_leaders(
                          "fielding",
                          "errors",
                          5,
                          False
                      ),

                  "doublePlays":
                      make_leaders(
                          "fielding",
                          "doublePlays"
                      )

              }

          }


          with open(
              "data/leaders.json",
              "w"
          ) as file:

              json.dump(
                  leaders,
                  file,
                  indent=2
              )

          PY


      - name: Save league leaders
        run: |

          git config user.name \
            "SportPulse Bot"

          git config user.email \
            "sportpulse-bot@users.noreply.github.com"

          git add data/leaders.json

          git diff --cached --quiet || \
            git commit -m \
            "Update MLB league leaders"

          git push
