name: Update MLB League Leaders

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-leaders:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build AL and NL League Leaders
        run: |

          python3 <<'PY'

          import json
          import urllib.request
          import urllib.parse
          import os
          from datetime import datetime, timezone


          SEASON = "2026"


          LEAGUES = {
              "AL": "103",
              "NL": "104"
          }


          def get_leaders(
              category,
              league_id,
              stat_group=None,
              exclude_pitchers=False
          ):

              # Ask for more than 5 defensive players
              # because pitchers will be removed first.

              limit = 50 if exclude_pitchers else 5


              params = {
                  "leaderCategories": category,
                  "season": SEASON,
                  "sportId": "1",
                  "leagueId": league_id,
                  "limit": limit,
                  "hydrate": "person,team"
              }


              if stat_group:

                  params["statGroup"] = stat_group


              url = (
                  "https://statsapi.mlb.com/api/v1/stats/leaders?"
                  + urllib.parse.urlencode(params)
              )


              print(
                  f"Loading {category} - League {league_id}"
              )


              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent":
                      "SportPulse/1.0"
                  }
              )


              with urllib.request.urlopen(
                  request,
                  timeout=30
              ) as response:

                  data = json.load(response)


              league_leaders = data.get(
                  "leagueLeaders",
                  []
              )


              if not league_leaders:

                  print(
                      f"No data returned for {category}"
                  )

                  return []


              leaders = league_leaders[0].get(
                  "leaders",
                  []
              )


              results = []


              for leader in leaders:

                  person = leader.get(
                      "person",
                      {}
                  )


                  team = leader.get(
                      "team",
                      {}
                  )


                  # --------------------------------
                  # EXCLUDE PITCHERS FROM DEFENSE
                  # --------------------------------

                  if exclude_pitchers:

                      position =
                          person.get(
                              "primaryPosition",
                              {}
                          )


                      abbreviation =
                          position.get(
                              "abbreviation",
                              ""
                          )


                      position_name =
                          position.get(
                              "name",
                              ""
                          )


                      position_type =
                          position.get(
                              "type",
                              ""
                          )


                      if (
                          abbreviation == "P"
                          or
                          position_name == "Pitcher"
                          or
                          position_type == "Pitcher"
                      ):

                          continue


                  results.append({

                      "rank":
                          len(results) + 1,

                      "player":
                          person.get(
                              "fullName",
                              "Unknown"
                          ),

                      "team":
                          team.get(
                              "name",
                              "Unknown"
                          ),

                      "value":
                          leader.get(
                              "value",
                              ""
                          )

                  })


                  # We only want the top 5
                  # AFTER pitchers are removed.

                  if len(results) >= 5:

                      break


              print(
                  f"  {len(results)} players"
              )


              return results


          # =========================================
          # CATEGORY DEFINITIONS
          # =========================================


          OFFENSE = {

              "battingAverage":
                  ("battingAverage", "hitting"),

              "hits":
                  ("hits", "hitting"),

              "homeRuns":
                  ("homeRuns", "hitting"),

              "rbi":
                  ("rbi", "hitting"),

              "runs":
                  ("runs", "hitting"),

              "obp":
                  ("onBasePercentage", "hitting"),

              "slg":
                  ("sluggingPercentage", "hitting"),

              "ops":
                  ("onBasePlusSlugging", "hitting"),

              "stolenBases":
                  ("stolenBases", None),

              "doubles":
                  ("doubles", "hitting"),

              "triples":
                  ("triples", "hitting")

          }


          PITCHING = {

              "era":
                  ("era", "pitching"),

              "wins":
                  ("wins", "pitching"),

              "strikeouts":
                  ("strikeouts", "pitching"),

              "whip":
                  ("whip", "pitching"),

              "saves":
                  ("saves", "pitching"),

              "innings":
                  ("inningsPitched", "pitching"),

              "qualityStarts":
                  ("qualityStarts", "pitching")

          }


          DEFENSE = {

              "fieldingPercentage":
                  ("fieldingPercentage", "fielding"),

              "putouts":
                  ("putouts", "fielding"),

              "assists":
                  ("assists", "fielding"),

              "errors":
                  ("errors", "fielding"),

              "doublePlays":
                  ("doublePlays", "fielding")

          }


          # =========================================
          # BUILD ONE LEAGUE
          # =========================================


          def build_league(league_id):

              result = {

                  "offense": {},

                  "pitching": {},

                  "defense": {},

                  "defenseNote":
                      "Pitchers are excluded from defensive statistics."

              }


              print("")
              print(
                  "=============================="
              )

              print(
                  f"BUILDING LEAGUE {league_id}"
              )

              print(
                  "=============================="
              )


              # -----------------------------
              # OFFENSE
              # -----------------------------

              for name, settings in OFFENSE.items():

                  try:

                      result["offense"][name] = \
                          get_leaders(
                              settings[0],
                              league_id,
                              settings[1]
                          )

                  except Exception as error:

                      print(
                          f"ERROR {name}: {error}"
                      )

                      result["offense"][name] = []


              # -----------------------------
              # PITCHING
              # -----------------------------

              for name, settings in PITCHING.items():

                  try:

                      result["pitching"][name] = \
                          get_leaders(
                              settings[0],
                              league_id,
                              settings[1]
                          )

                  except Exception as error:

                      print(
                          f"ERROR {name}: {error}"
                      )

                      result["pitching"][name] = []


              # -----------------------------
              # DEFENSE
              # -----------------------------

              for name, settings in DEFENSE.items():

                  try:

                      result["defense"][name] = \
                          get_leaders(
                              settings[0],
                              league_id,
                              settings[1],
                              True
                          )

                  except Exception as error:

                      print(
                          f"ERROR {name}: {error}"
                      )

                      result["defense"][name] = []


              return result


          # =========================================
          # BUILD AL
          # =========================================

          print("")
          print(
              "BUILDING AMERICAN LEAGUE"
          )


          AL = build_league(
              LEAGUES["AL"]
          )


          # =========================================
          # BUILD NL
          # =========================================

          print("")
          print(
              "BUILDING NATIONAL LEAGUE"
          )


          NL = build_league(
              LEAGUES["NL"]
          )


          # =========================================
          # FINAL JSON
          # =========================================

          output = {

              "season": 2026,

              "lastUpdated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "leagues": {

                  "AL": AL,

                  "NL": NL

              }

          }


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/leaders.json",
              "w"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2
              )


          # =========================================
          # VALIDATION
          # =========================================

          total = 0


          for league in [
              AL,
              NL
          ]:

              for section in [
                  "offense",
                  "pitching",
                  "defense"
              ]:

                  for category in \
                      league[section].values():

                      if isinstance(
                          category,
                          list
                      ):

                          total += len(category)


          print("")
          print(
              "=============================="
          )

          print(
              f"TOTAL LEADER RECORDS: {total}"
          )

          print(
              "=============================="
          )


          print("")
          print(
              "Pitchers have been excluded "
              "from all defensive categories."
          )


          # =========================================
          # VERIFY STOLEN BASES
          # =========================================

          print("")
          print(
              "AL STOLEN BASE LEADERS:"
          )


          for player in AL[
              "offense"
          ][
              "stolenBases"
          ]:

              print(
                  player["rank"],
                  player["player"],
                  player["team"],
                  player["value"]
              )


          print("")
          print(
              "NL STOLEN BASE LEADERS:"
          )


          for player in NL[
              "offense"
          ][
              "stolenBases"
          ]:

              print(
                  player["rank"],
                  player["player"],
                  player["team"],
                  player["value"]
              )


          PY


      - name: Save updated leaders
        run: |

          git config user.name \
            "SportPulse Bot"

          git config user.email \
            "sportpulse-bot@users.noreply.github.com"

          git add data/leaders.json

          git diff --cached --quiet || \
            git commit -m \
            "Update AL and NL MLB league leaders"

          git push
