name: Update MLB League Leaders

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-leaders:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build MLB league leaders
        run: |

          python3 <<'PY'

          import json
          import urllib.request
          import urllib.parse
          import os
          from datetime import datetime, timezone


          SEASON = "2026"


          def get_leaders(category, group):

              params = {
                  "leaderCategories": category,
                  "season": SEASON,
                  "sportId": "1",
                  "statGroup": group,
                  "leaderGameTypes": "R",
                  "limit": "5",
                  "hydrate": "person,team"
              }

              url = (
                  "https://statsapi.mlb.com/api/v1/stats/leaders?"
                  + urllib.parse.urlencode(params)
              )

              try:

                  request = urllib.request.Request(
                      url,
                      headers={
                          "User-Agent":
                          "SportPulse MLB/1.0"
                      }
                  )

                  with urllib.request.urlopen(
                      request,
                      timeout=30
                  ) as response:

                      data = json.load(response)

                  output = []

                  for item in data.get(
                      "leagueLeaders",
                      []
                  ):

                      player = item.get(
                          "person",
                          {}
                      )

                      team = item.get(
                          "team",
                          {}
                      )

                      value = item.get(
                          "value",
                          item.get(
                              "value",
                              ""
                          )
                      )

                      output.append({

                          "player":
                              player.get(
                                  "fullName",
                                  "Unknown"
                              ),

                          "team":
                              team.get(
                                  "name",
                                  "Unknown"
                              ),

                          "value":
                              value

                      })

                  return output

              except Exception as e:

                  print(
                      f"Could not load "
                      f"{category}: {e}"
                  )

                  return []


          def build_group(categories):

              result = {}

              for category, group in categories:

                  print(
                      f"Loading {category}..."
                  )

                  result[category] = get_leaders(
                      category,
                      group
                  )

              return result


          data = {

              "season": 2026,

              "lastUpdated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),


              "offense": build_group([

                  ("battingAverage", "hitting"),
                  ("hits", "hitting"),
                  ("homeRuns", "hitting"),
                  ("rbi", "hitting"),
                  ("runs", "hitting"),
                  ("onBasePercentage", "hitting"),
                  ("sluggingPercentage", "hitting"),
                  ("onBasePlusSlugging", "hitting"),
                  ("stolenBases", "running"),
                  ("doubles", "hitting"),
                  ("triples", "hitting")

              ]),


              "pitching": build_group([

                  ("era", "pitching"),
                  ("wins", "pitching"),
                  ("strikeouts", "pitching"),
                  ("whip", "pitching"),
                  ("saves", "pitching"),
                  ("inningsPitched", "pitching"),
                  ("qualityStarts", "pitching")

              ]),


              "defense": build_group([

                  ("fieldingPercentage", "fielding"),
                  ("putouts", "fielding"),
                  ("assists", "fielding"),
                  ("errors", "fielding"),
                  ("doublePlays", "fielding")

              ])

          }


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/leaders.json",
              "w"
          ) as f:

              json.dump(
                  data,
                  f,
                  indent=2
              )


          total = 0

          for group in data:

              if group in [
                  "offense",
                  "pitching",
                  "defense"
              ]:

                  for players in data[group].values():

                      total += len(players)


          print(
              f"Total leader records: {total}"
          )

          if total == 0:

              raise Exception(
                  "No MLB leader data was returned."
              )

          PY


      - name: Save updated leaders
        run: |

          git config user.name \
            "SportPulse Bot"

          git config user.email \
            "sportpulse-bot@users.noreply.github.com"

          git add data/leaders.json

          git diff --cached --quiet || \
            git commit -m \
            "Update MLB league leaders"

          git push
