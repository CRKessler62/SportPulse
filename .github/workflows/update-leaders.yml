name: Update MLB League Leaders

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  update-leaders:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Build MLB League Leaders
        run: |

          python3 <<'PY'

          import json
          import urllib.request
          import urllib.parse
          import os
          from datetime import datetime, timezone


          SEASON = "2026"


          LEAGUES = {
              "AL": "103",
              "NL": "104"
          }


          # =========================================
          # GET MLB LEADERS
          # =========================================

          def get_leaders(
              category,
              league_id,
              stat_group=None,
              exclude_pitchers=False
          ):

              # Get extra players for defense because
              # pitchers will be removed before taking
              # the final top 5.

              limit = 50 if exclude_pitchers else 5


              params = {

                  "leaderCategories":
                      category,

                  "season":
                      SEASON,

                  "sportId":
                      "1",

                  "leagueId":
                      league_id,

                  "limit":
                      limit,

                  "hydrate":
                      "person,team"

              }


              if stat_group:

                  params["statGroup"] = stat_group


              url = (
                  "https://statsapi.mlb.com/api/v1/stats/leaders?"
                  +
                  urllib.parse.urlencode(params)
              )


              print("")
              print(
                  "Loading:",
                  category,
                  "League:",
                  league_id
              )


              request = urllib.request.Request(

                  url,

                  headers={
                      "User-Agent":
                      "SportPulse/1.0"
                  }

              )


              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  data = json.load(response)


              league_leaders = data.get(
                  "leagueLeaders",
                  []
              )


              if not league_leaders:

                  print(
                      "No leader data returned."
                  )

                  return []


              leaders = league_leaders[0].get(
                  "leaders",
                  []
              )


              results = []


              for leader in leaders:

                  person = leader.get(
                      "person",
                      {}
                  )


                  team = leader.get(
                      "team",
                      {}
                  )


                  # =================================
                  # PLAYER POSITION
                  # =================================

                  position = person.get(
                      "primaryPosition",
                      {}
                  )


                  position_name = position.get(
                      "abbreviation",
                      ""
                  )


                  if not position_name:

                      position_name = position.get(
                          "name",
                          ""
                      )


                  # =================================
                  # EXCLUDE PITCHERS FROM DEFENSE
                  # =================================

                  if exclude_pitchers:

                      is_pitcher = False


                      if position_name == "P":

                          is_pitcher = True


                      if position_name.lower() == "pitcher":

                          is_pitcher = True


                      if is_pitcher:

                          continue


                  # =================================
                  # ADD PLAYER
                  # =================================

                  results.append({

                      "rank":
                          len(results) + 1,

                      "player":
                          person.get(
                              "fullName",
                              "Unknown"
                          ),

                      "team":
                          team.get(
                              "name",
                              "Unknown"
                          ),

                      "position":
                          position_name,

                      "value":
                          leader.get(
                              "value",
                              ""
                          )

                  })


                  # Stop once we have five
                  # non-pitchers.

                  if len(results) >= 5:

                      break


              print(
                  "Players returned:",
                  len(results)
              )


              return results


          # =========================================
          # CATEGORIES
          # =========================================


          OFFENSE = {

              "battingAverage":
                  (
                      "battingAverage",
                      "hitting"
                  ),

              "hits":
                  (
                      "hits",
                      "hitting"
                  ),

              "homeRuns":
                  (
                      "homeRuns",
                      "hitting"
                  ),

              "rbi":
                  (
                      "rbi",
                      "hitting"
                  ),

              "runs":
                  (
                      "runs",
                      "hitting"
                  ),

              "obp":
                  (
                      "onBasePercentage",
                      "hitting"
                  ),

              "slg":
                  (
                      "sluggingPercentage",
                      "hitting"
                  ),

              "ops":
                  (
                      "onBasePlusSlugging",
                      "hitting"
                  ),

              "stolenBases":
                  (
                      "stolenBases",
                      None
                  ),

              "doubles":
                  (
                      "doubles",
                      "hitting"
                  ),

              "triples":
                  (
                      "triples",
                      "hitting"
                  )

          }


          PITCHING = {

              "era":
                  (
                      "era",
                      "pitching"
                  ),

              "wins":
                  (
                      "wins",
                      "pitching"
                  ),

              "strikeouts":
                  (
                      "strikeouts",
                      "pitching"
                  ),

              "whip":
                  (
                      "whip",
                      "pitching"
                  ),

              "saves":
                  (
                      "saves",
                      "pitching"
                  ),

              "innings":
                  (
                      "inningsPitched",
                      "pitching"
                  ),

              "qualityStarts":
                  (
                      "qualityStarts",
                      "pitching"
                  )

          }


          DEFENSE = {

              "fieldingPercentage":
                  (
                      "fieldingPercentage",
                      "fielding"
                  ),

              "putouts":
                  (
                      "putouts",
                      "fielding"
                  ),

              "assists":
                  (
                      "assists",
                      "fielding"
                  ),

              "errors":
                  (
                      "errors",
                      "fielding"
                  ),

              "doublePlays":
                  (
                      "doublePlays",
                      "fielding"
                  )

          }


          # =========================================
          # BUILD ONE LEAGUE
          # =========================================

          def build_league(league_id):

              league = {

                  "offense": {},

                  "pitching": {},

                  "defense": {},

                  "defenseNote":
                      "Pitchers are excluded from all defensive statistics."

              }


              print("")
              print(
                  "================================"
              )

              print(
                  "BUILDING LEAGUE:",
                  league_id
              )

              print(
                  "================================"
              )


              # ---------------------------------
              # OFFENSE
              # ---------------------------------

              for name, settings in OFFENSE.items():

                  try:

                      league["offense"][name] = \
                          get_leaders(

                              settings[0],

                              league_id,

                              settings[1],

                              False

                          )

                  except Exception as error:

                      print(
                          "ERROR:",
                          name,
                          error
                      )

                      league["offense"][name] = []


              # ---------------------------------
              # PITCHING
              # ---------------------------------

              for name, settings in PITCHING.items():

                  try:

                      league["pitching"][name] = \
                          get_leaders(

                              settings[0],

                              league_id,

                              settings[1],

                              False

                          )

                  except Exception as error:

                      print(
                          "ERROR:",
                          name,
                          error
                      )

                      league["pitching"][name] = []


              # ---------------------------------
              # DEFENSE
              # ---------------------------------

              for name, settings in DEFENSE.items():

                  try:

                      league["defense"][name] = \
                          get_leaders(

                              settings[0],

                              league_id,

                              settings[1],

                              True

                          )

                  except Exception as error:

                      print(
                          "ERROR:",
                          name,
                          error
                      )

                      league["defense"][name] = []


              return league


          # =========================================
          # BUILD AL
          # =========================================

          print("")
          print(
              "AMERICAN LEAGUE"
          )


          AL = build_league(
              LEAGUES["AL"]
          )


          # =========================================
          # BUILD NL
          # =========================================

          print("")
          print(
              "NATIONAL LEAGUE"
          )


          NL = build_league(
              LEAGUES["NL"]
          )


          # =========================================
          # CREATE OUTPUT
          # =========================================

          output = {

              "season":
                  2026,

              "lastUpdated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "leagues": {

                  "AL":
                      AL,

                  "NL":
                      NL

              }

          }


          # =========================================
          # SAVE JSON
          # =========================================

          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/leaders.json",
              "w"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2
              )


          # =========================================
          # VALIDATION
          # =========================================

          total = 0


          for league in [
              AL,
              NL
          ]:

              for section in [
                  "offense",
                  "pitching",
                  "defense"
              ]:

                  for players in \
                      league[section].values():

                      total += len(players)


          print("")
          print(
              "================================"
          )

          print(
              "TOTAL LEADER RECORDS:",
              total
          )

          print(
              "================================"
          )


          # =========================================
          # POSITION CHECK
          # =========================================

          print("")
          print(
              "POSITION CHECK"
          )


          sample = AL["offense"]["homeRuns"]


          for player in sample:

              print(
                  player["player"],
                  "|",
                  player["team"],
                  "|",
                  player["position"],
                  "|",
                  player["value"]
              )


          # =========================================
          # STOLEN BASE CHECK
          # =========================================

          print("")
          print(
              "AL STOLEN BASE LEADERS"
          )


          for player in \
              AL["offense"]["stolenBases"]:

              print(
                  player["rank"],
                  player["player"],
                  "|",
                  player["team"],
                  "|",
                  player["position"],
                  "|",
                  player["value"]
              )


          print("")
          print(
              "NL STOLEN BASE LEADERS"
          )


          for player in \
              NL["offense"]["stolenBases"]:

              print(
                  player["rank"],
                  player["player"],
                  "|",
                  player["team"],
                  "|",
                  player["position"],
                  "|",
                  player["value"]
              )


          if total == 0:

              raise Exception(
                  "No MLB leader data was returned."
              )


          PY


      - name: Save updated leaders
        run: |

          git config user.name \
            "SportPulse Bot"

          git config user.email \
            "sportpulse-bot@users.noreply.github.com"

          git add data/leaders.json

          git diff --cached --quiet || \
            git commit -m \
            "Update MLB league leaders with positions"

          git push
