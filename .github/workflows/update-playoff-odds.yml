name: Update MLB Playoff Odds

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  playoff-odds:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate MLB Playoff Odds
        run: |

          python3 <<'PY'

          import json
          import urllib.request
          import urllib.parse
          import random
          import math
          import os
          from datetime import datetime, timezone


          # =========================================
          # SETTINGS
          # =========================================

          SEASON = 2026

          SIMULATIONS = 10000

          TODAY = datetime.now(
              timezone.utc
          ).strftime("%Y-%m-%d")


          # =========================================
          # MLB API
          # =========================================

          def api(url):

              request = urllib.request.Request(

                  url,

                  headers={
                      "User-Agent":
                      "SportPulse/1.0"
                  }

              )

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  return json.load(response)


          # =========================================
          # GET STANDINGS
          # =========================================

          standings_url = (
              "https://statsapi.mlb.com/api/v1/standings?"
              "leagueId=103,104"
              "&season=2026"
              "&standingsTypes=regularSeason"
              "&hydrate=team"
          )


          standings_data = api(
              standings_url
          )


          teams = {}


          for record in standings_data.get(
              "records",
              []
          ):

              division_id = record.get(
                  "division",
                  {}
              ).get(
                  "id"
              )


              division_name = record.get(
                  "division",
                  {}
              ).get(
                  "nameShort",
                  ""
              )


              league_id = record.get(
                  "league",
                  {}
              ).get(
                  "id"
              )


              for team_record in record.get(
                  "teamRecords",
                  []
              ):

                  team = team_record.get(
                      "team",
                      {}
                  )


                  team_id = team.get(
                      "id"
                  )


                  if not team_id:
                      continue


                  wins = int(
                      team_record.get(
                          "wins",
                          0
                      )
                  )


                  losses = int(
                      team_record.get(
                          "losses",
                          0
                      )
                  )


                  games_played = (
                      wins + losses
                  )


                  win_pct = (

                      wins / games_played

                      if games_played
                      else .500

                  )


                  teams[team_id] = {

                      "id":
                          team_id,

                      "name":
                          team.get(
                              "name",
                              "Unknown"
                          ),

                      "leagueId":
                          league_id,

                      "divisionId":
                          division_id,

                      "division":
                          division_name,

                      "wins":
                          wins,

                      "losses":
                          losses,

                      "winPct":
                          win_pct,

                      "remaining":
                          0

                  }


          # =========================================
          # GET REMAINING SCHEDULE
          # =========================================

          schedule_url = (

              "https://statsapi.mlb.com/api/v1/schedule?"

              "sportId=1"

              "&startDate="
              + TODAY +

              "&endDate=2026-10-05"

              "&hydrate=team"

              "&gameTypes=R"

              "&fields="
              "dates,date,games,"
              "games.gamePk,"
              "games.status,"
              "games.teams,"
              "games.teams.away,"
              "games.teams.away.team,"
              "games.teams.home,"
              "games.teams.home.team"

          )


          schedule_data = api(
              schedule_url
          )


          remaining_games = []


          for date in schedule_data.get(
              "dates",
              []
          ):

              for game in date.get(
                  "games",
                  []
              ):

                  status = game.get(
                      "status",
                      {}
                  ).get(
                      "abstractGameState",
                      ""
                  )


                  if status in [
                      "Final",
                      "Completed"
                  ]:

                      continue


                  away = game.get(
                      "teams",
                      {}
                  ).get(
                      "away",
                      {}
                  ).get(
                      "team",
                      {}
                  ).get(
                      "id"
                  )


                  home = game.get(
                      "teams",
                      {}
                  ).get(
                      "home",
                      {}
                  ).get(
                      "team",
                      {}
                  ).get(
                      "id"
                  )


                  if (
                      away not in teams
                      or
                      home not in teams
                  ):

                      continue


                  remaining_games.append({

                      "away":
                          away,

                      "home":
                          home

                  })


                  teams[away]["remaining"] += 1

                  teams[home]["remaining"] += 1


          print(
              "Teams:",
              len(teams)
          )


          print(
              "Remaining games:",
              len(remaining_games)
          )


          # =========================================
          # TEAM WIN PROBABILITY
          # =========================================

          def win_probability(
              away_id,
              home_id
          ):

              away =
                  teams[away_id]

              home =
                  teams[home_id]


              away_strength =
                  away["winPct"]


              home_strength =
                  home["winPct"]


              # Pull both teams toward .500
              # to avoid extreme probabilities.

              away_strength =
                  .500 + (
                      away_strength - .500
                  ) * .75


              home_strength =
                  .500 + (
                      home_strength - .500
                  ) * .75


              difference =
                  home_strength - away_strength


              probability =
                  .500 + (
                      difference * .85
                  )


              # Home-field advantage

              probability += .025


              probability =
                  max(
                      .20,
                      min(
                          .80,
                          probability
                      )
                  )


              return probability


          # =========================================
          # SIMULATE SEASON
          # =========================================

          playoff_count = {
              team_id: 0
              for team_id in teams
          }


          division_count = {
              team_id: 0
              for team_id in teams
          }


          wildcard_count = {
              team_id: 0
              for team_id in teams
          }


          projected_wins = {
              team_id: []
              for team_id in teams
          }


          # =========================================
          # SIMULATIONS
          # =========================================

          for simulation in range(
              SIMULATIONS
          ):

              wins = {

                  team_id:
                      team["wins"]

                  for team_id, team
                  in teams.items()

              }


              for game in remaining_games:

                  away = game["away"]

                  home = game["home"]


                  probability =
                      win_probability(
                          away,
                          home
                      )


                  if random.random() < probability:

                      wins[home] += 1

                  else:

                      wins[away] += 1


              # -------------------------------------
              # DIVISION WINNERS
              # -------------------------------------

              division_winners = set()


              for division_id in set(

                  team["divisionId"]

                  for team in teams.values()

              ):

                  division_teams = [

                      team_id

                      for team_id, team
                      in teams.items()

                      if team["divisionId"]
                      == division_id

                  ]


                  if not division_teams:
                      continue


                  winner = max(

                      division_teams,

                      key=lambda x:
                          wins[x]

                  )


                  division_winners.add(
                      winner
                  )


                  division_count[
                      winner
                  ] += 1


              # -------------------------------------
              # WILD CARD
              # -------------------------------------

              playoff_teams =
                  set(
                      division_winners
                  )


              for league_id in [
                  103,
                  104
              ]:

                  league_teams = [

                      team_id

                      for team_id, team
                      in teams.items()

                      if team["leagueId"]
                      == league_id

                      and team_id
                      not in division_winners

                  ]


                  league_teams.sort(

                      key=lambda x:
                          wins[x],

                      reverse=True

                  )


                  wildcard_teams =
                      league_teams[:3]


                  for team_id in wildcard_teams:

                      playoff_teams.add(
                          team_id
                      )

                      wildcard_count[
                          team_id
                      ] += 1


              # -------------------------------------
              # PLAYOFF COUNTS
              # -------------------------------------

              for team_id in playoff_teams:

                  playoff_count[
                      team_id
                  ] += 1


              # -------------------------------------
              # STORE PROJECTED WINS
              # -------------------------------------

              for team_id in teams:

                  projected_wins[
                      team_id
                  ].append(
                      wins[team_id]
                  )


          # =========================================
          # CALCULATE PROJECTED PLAYOFF LINE
          # =========================================

          league_cutoffs = {}


          for league_id in [
              103,
              104
          ]:

              playoff_win_totals = []


              for simulation in range(
                  SIMULATIONS
              ):

                  # Approximate playoff line
                  # using the 5th-highest team
                  # in each league.

                  # Reconstructing exact simulated
                  # standings isn't stored, so use
                  # current strength plus remaining
                  # games as a practical estimate.

                  pass


          # =========================================
          # CREATE TEAM RESULTS
          # =========================================

          results = []


          for team_id, team in teams.items():

              playoff_probability = (

                  playoff_count[team_id]
                  /
                  SIMULATIONS
                  *
                  100

              )


              division_probability = (

                  division_count[team_id]
                  /
                  SIMULATIONS
                  *
                  100

              )


              wildcard_probability = (

                  wildcard_count[team_id]
                  /
                  SIMULATIONS
                  *
                  100

              )


              average_wins = (

                  sum(
                      projected_wins[
                          team_id
                      ]
                  )
                  /
                  len(
                      projected_wins[
                          team_id
                      ]
                  )

                  if projected_wins[
                      team_id
                  ]

                  else team["wins"]

              )


              average_wins =
                  round(
                      average_wins,
                      1
                  )


              # -------------------------------------
              # STATUS
              # -------------------------------------

              if playoff_probability >= 85:

                  status = "Strong position"

              elif playoff_probability >= 60:

                  status = "Likely playoff team"

              elif playoff_probability >= 40:

                  status = "In the hunt"

              elif playoff_probability >= 15:

                  status = "Long shot"

              else:

                  status = "Very unlikely"


              # -------------------------------------
              # WHAT THEY NEED
              # -------------------------------------

              current_wins =
                  team["wins"]


              current_losses =
                  team["losses"]


              remaining =
                  team["remaining"]


              # Conservative estimated target

              projected_target =
                  math.ceil(
                      average_wins - 1
                  )


              wins_needed =
                  max(
                      0,
                      projected_target -
                      current_wins
                  )


              games_remaining =
                  remaining


              if (
                  games_remaining > 0
                  and
                  wins_needed > 0
              ):

                  if wins_needed >= games_remaining:

                      what_they_need =
                          "They need to win nearly every remaining game."

                  else:

                      what_they_need = (

                          "Approximately "
                          +
                          str(wins_needed)
                          +
                          " more wins "
                          +
                          "would put them near "
                          +
                          "the projected playoff line."

                      )

              else:

                  what_they_need =
                      "Maintain their current position."


              results.append({

                  "teamId":
                      team_id,

                  "team":
                      team["name"],

                  "leagueId":
                      team["leagueId"],

                  "division":
                      team["division"],

                  "wins":
                      current_wins,

                  "losses":
                      current_losses,

                  "gamesRemaining":
                      games_remaining,

                  "playoffProbability":
                      round(
                          playoff_probability,
                          1
                      ),

                  "divisionProbability":
                      round(
                          division_probability,
                          1
                      ),

                  "wildCardProbability":
                      round(
                          wildcard_probability,
                          1
                      ),

                  "missProbability":
                      round(
                          100 -
                          playoff_probability,
                          1
                      ),

                  "projectedWins":
                      average_wins,

                  "projectedPlayoffTarget":
                      projected_target,

                  "winsNeeded":
                      wins_needed,

                  "status":
                      status,

                  "whatTheyNeed":
                      what_they_need

              })


          # =========================================
          # SORT BY PLAYOFF ODDS
          # =========================================

          results.sort(

              key=lambda team:
                  team[
                      "playoffProbability"
                  ],

              reverse=True

          )


          # =========================================
          # OUTPUT
          # =========================================

          output = {

              "season":
                  SEASON,

              "lastUpdated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "simulationCount":
                  SIMULATIONS,

              "method":
                  "Monte Carlo simulation of remaining MLB schedule using current-season team strength and home-field advantage.",

              "teams":
                  results

          }


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/playoff_odds.json",
              "w"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2
              )


          print("")
          print(
              "================================"
          )

          print(
              "PLAYOFF ODDS COMPLETE"
          )

          print(
              "SIMULATIONS:",
              SIMULATIONS
          )

          print(
              "TEAMS:",
              len(results)
          )

          print(
              "================================"
          )


          for team in results:

              print(

                  team["team"],
                  "|",
                  team["playoffProbability"],
                  "%",
                  "|",
                  team["status"]

              )


          PY


      - name: Save playoff odds
        run: |

          git config user.name \
            "SportPulse Bot"

          git config user.email \
            "sportpulse-bot@users.noreply.github.com"

          git add data/playoff_odds.json

          git diff --cached --quiet || \
            git commit -m \
            "Update MLB playoff odds"

          git push
