name: Update MLB Playoff Odds

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  playoff-odds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calculate MLB Playoff Odds
        run: |

          python3 <<'PY'

          import json
          import os
          import random
          import urllib.request
          from datetime import datetime, timezone

          SEASON = 2026
          SIMULATIONS = 10000


          def api(url):

              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "SportPulse/1.0"
                  }
              )

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  return json.load(response)


          # =========================================
          # GET CURRENT STANDINGS
          # =========================================

          teams = {}

          standings_url = (
              "https://statsapi.mlb.com/api/v1/standings"
              "?leagueId=103,104"
              "&season=2026"
              "&standingsTypes=regularSeason"
          )

          print("Loading MLB standings...")

          standings = api(standings_url)

          for record in standings.get("records", []):

              division = record.get(
                  "division",
                  {}
              )

              division_id = division.get(
                  "id"
              )

              division_name = division.get(
                  "nameShort",
                  ""
              )

              league = record.get(
                  "league",
                  {}
              )

              league_id = league.get(
                  "id"
              )

              for item in record.get(
                  "teamRecords",
                  []
              ):

                  team = item.get(
                      "team",
                      {}
                  )

                  team_id = team.get(
                      "id"
                  )

                  if not team_id:
                      continue

                  wins = int(
                      item.get(
                          "wins",
                          0
                      )
                  )

                  losses = int(
                      item.get(
                          "losses",
                          0
                      )
                  )

                  games = wins + losses

                  win_pct = (
                      wins / games
                      if games
                      else 0.500
                  )

                  teams[team_id] = {

                      "id": team_id,

                      "name": team.get(
                          "name",
                          "Unknown"
                      ),

                      "leagueId": league_id,

                      "divisionId": division_id,

                      "division": division_name,

                      "wins": wins,

                      "losses": losses,

                      "winPct": win_pct,

                      "remaining": 0

                  }


          print(
              "Teams loaded:",
              len(teams)
          )


          if len(teams) != 30:

              raise RuntimeError(
                  "Expected 30 teams, found "
                  + str(len(teams))
              )


          # =========================================
          # GET REMAINING SCHEDULE
          # =========================================

          today = datetime.now(
              timezone.utc
          ).strftime(
              "%Y-%m-%d"
          )


          schedule_url = (

              "https://statsapi.mlb.com/api/v1/schedule"

              "?sportId=1"

              "&startDate="
              + today

              + "&endDate=2026-10-04"

              + "&gameTypes=R"

              + "&limit=1000"

          )


          print(
              "Loading remaining schedule..."
          )


          schedule = api(
              schedule_url
          )


          remaining_games = []


          for date in schedule.get(
              "dates",
              []
          ):

              for game in date.get(
                  "games",
                  []
              ):

                  status = game.get(
                      "status",
                      {}
                  )


                  if status.get(
                      "abstractGameState"
                  ) == "Final":

                      continue


                  game_teams = game.get(
                      "teams",
                      {}
                  )


                  away = (
                      game_teams
                      .get("away", {})
                      .get("team", {})
                      .get("id")
                  )


                  home = (
                      game_teams
                      .get("home", {})
                      .get("team", {})
                      .get("id")
                  )


                  if (
                      away not in teams
                      or
                      home not in teams
                  ):

                      continue


                  remaining_games.append(
                      (away, home)
                  )


                  teams[away][
                      "remaining"
                  ] += 1


                  teams[home][
                      "remaining"
                  ] += 1


          print(
              "Remaining games:",
              len(remaining_games)
          )


          # =========================================
          # WIN PROBABILITY
          # =========================================

          def home_win_probability(
              away_id,
              home_id
          ):

              away_pct = teams[
                  away_id
              ]["winPct"]


              home_pct = teams[
                  home_id
              ]["winPct"]


              probability = (

                  0.50

                  +

                  (
                      home_pct
                      -
                      away_pct
                  )

                  * 0.85

                  +

                  0.025

              )


              return max(
                  0.20,
                  min(
                      0.80,
                      probability
                  )
              )


          # =========================================
          # STORAGE
          # =========================================

          playoff_count = {

              team_id: 0

              for team_id in teams

          }


          division_count = {

              team_id: 0

              for team_id in teams

          }


          wildcard_count = {

              team_id: 0

              for team_id in teams

          }


          simulated_wins = {

              team_id: []

              for team_id in teams

          }


          cutoff_samples = {

              103: [],

              104: []

          }


          # =========================================
          # RUN 10,000 SIMULATIONS
          # =========================================

          print(
              "Running",
              SIMULATIONS,
              "simulations..."
          )


          for simulation in range(
              SIMULATIONS
          ):

              wins = {

                  team_id:
                      team["wins"]

                  for team_id, team
                  in teams.items()

              }


              # Simulate remaining games

              for away, home in remaining_games:

                  probability = (
                      home_win_probability(
                          away,
                          home
                      )
                  )


                  if random.random() < probability:

                      wins[home] += 1

                  else:

                      wins[away] += 1


              # =====================================
              # DIVISION WINNERS
              # =====================================

              division_winners = set()


              division_ids = set(

                  team["divisionId"]

                  for team in teams.values()

              )


              for division_id in division_ids:

                  division_teams = [

                      team_id

                      for team_id, team
                      in teams.items()

                      if team["divisionId"]
                      == division_id

                  ]


                  winner = max(

                      division_teams,

                      key=lambda team_id: (

                          wins[team_id],

                          teams[
                              team_id
                          ]["winPct"]

                      )

                  )


                  division_winners.add(
                      winner
                  )


                  division_count[
                      winner
                  ] += 1


              # =====================================
              # WILD CARDS
              # =====================================

              playoff_teams = set(
                  division_winners
              )


              for league_id in [
                  103,
                  104
              ]:

                  league_teams = [

                      team_id

                      for team_id, team
                      in teams.items()

                      if (
                          team["leagueId"]
                          == league_id

                          and

                          team_id
                          not in division_winners
                      )

                  ]


                  league_teams.sort(

                      key=lambda team_id: (

                          wins[team_id],

                          teams[
                              team_id
                          ]["winPct"]

                      ),

                      reverse=True

                  )


                  wild_cards = (
                      league_teams[:3]
                  )


                  for team_id in wild_cards:

                      playoff_teams.add(
                          team_id
                      )

                      wildcard_count[
                          team_id
                      ] += 1


                  # Find the fifth playoff team
                  # in this league.

                  league_playoff_wins = sorted(

                      [

                          wins[team_id]

                          for team_id
                          in playoff_teams

                          if teams[
                              team_id
                          ]["leagueId"]
                          == league_id

                      ],

                      reverse=True

                  )


                  if len(
                      league_playoff_wins
                  ) >= 5:

                      cutoff_samples[
                          league_id
                      ].append(

                          league_playoff_wins[4]

                      )


              # =====================================
              # COUNT PLAYOFF TEAMS
              # =====================================

              for team_id in playoff_teams:

                  playoff_count[
                      team_id
                  ] += 1


              # =====================================
              # SAVE PROJECTED WINS
              # =====================================

              for team_id in teams:

                  simulated_wins[
                      team_id
                  ].append(

                      wins[team_id]

                  )


          # =========================================
          # MEDIAN
          # =========================================

          def median(values):

              if not values:

                  return 0


              values = sorted(
                  values
              )


              middle = len(
                  values
              ) // 2


              if len(values) % 2:

                  return values[
                      middle
                  ]


              return (

                  values[
                      middle - 1
                  ]

                  +

                  values[
                      middle
                  ]

              ) / 2


          # =========================================
          # PROJECTED PLAYOFF LINES
          # =========================================

          targets = {

              103: int(
                  round(
                      median(
                          cutoff_samples[
                              103
                          ]
                      )
                  )
              ),

              104: int(
                  round(
                      median(
                          cutoff_samples[
                              104
                          ]
                      )
                  )
              )

          }


          print(
              "AL projected playoff line:",
              targets[103]
          )


          print(
              "NL projected playoff line:",
              targets[104]
          )


          # =========================================
          # BUILD RESULTS
          # =========================================

          results = []


          for team_id, team in teams.items():

              playoff_pct = (

                  playoff_count[
                      team_id
                  ]

                  /

                  SIMULATIONS

                  *

                  100

              )


              division_pct = (

                  division_count[
                      team_id
                  ]

                  /

                  SIMULATIONS

                  *

                  100

              )


              wildcard_pct = (

                  wildcard_count[
                      team_id
                  ]

                  /

                  SIMULATIONS

                  *

                  100

              )


              miss_pct = (
                  100 -
                  playoff_pct
              )


              projected_wins = (

                  sum(
                      simulated_wins[
                          team_id
                      ]
                  )

                  /

                  SIMULATIONS

              )


              league_target = targets[
                  team["leagueId"]
              ]


              wins_needed = max(

                  0,

                  league_target
                  -
                  team["wins"]

              )


              # =====================================
              # STATUS
              # =====================================

              if playoff_pct >= 90:

                  status = (
                      "Very strong position"
                  )

                  need = (
                      "Maintain their current "
                      "pace and avoid a major collapse."
                  )


              elif playoff_pct >= 75:

                  status = (
                      "Strong position"
                  )

                  if wins_needed:

                      need = (

                          "About "

                          +
                          str(
                              wins_needed
                          )

                          +

                          " more wins to reach "
                          "the projected playoff line."

                      )

                  else:

                      need = (
                          "Stay above the "
                          "projected playoff line."
                      )


              elif playoff_pct >= 50:

                  status = (
                      "In the hunt"
                  )

                  need = (

                      "About "

                      +

                      str(
                          wins_needed
                      )

                      +

                      " more wins to reach "
                      "the projected playoff line."

                  )


              elif playoff_pct >= 25:

                  status = (
                      "Bubble team"
                  )

                  need = (

                      "About "

                      +

                      str(
                          wins_needed
                      )

                      +

                      " more wins and help "
                      "from other results."

                  )


              elif playoff_pct >= 5:

                  status = (
                      "Long shot"
                  )

                  need = (

                      "They likely need a strong "
                      "finish, around "

                      +

                      str(
                          wins_needed
                      )

                      +

                      " more wins, plus help."

                  )


              else:

                  status = (
                      "Very unlikely"
                  )

                  need = (
                      "They need a major turnaround "
                      "and significant help from "
                      "other teams."
                  )


              results.append({

                  "teamId":
                      team_id,

                  "team":
                      team["name"],

                  "league":
                      (
                          "AL"

                          if
                          team["leagueId"] == 103

                          else

                          "NL"
                      ),

                  "division":
                      team["division"],

                  "wins":
                      team["wins"],

                  "losses":
                      team["losses"],

                  "gamesRemaining":
                      team["remaining"],

                  "playoffProbability":
                      round(
                          playoff_pct,
                          1
                      ),

                  "divisionProbability":
                      round(
                          division_pct,
                          1
                      ),

                  "wildCardProbability":
                      round(
                          wildcard_pct,
                          1
                      ),

                  "missProbability":
                      round(
                          miss_pct,
                          1
                      ),

                  "projectedWins":
                      round(
                          projected_wins,
                          1
                      ),

                  "projectedPlayoffTarget":
                      league_target,

                  "winsNeeded":
                      wins_needed,

                  "status":
                      status,

                  "whatTheyNeed":
                      need

              })


          # =========================================
          # SORT
          # =========================================

          results.sort(

              key=lambda team: (

                  team["league"],

                  -team[
                      "playoffProbability"
                  ]

              )

          )


          # =========================================
          # SAVE JSON
          # =========================================

          output = {

              "season":
                  SEASON,

              "lastUpdated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "simulationCount":
                  SIMULATIONS,

              "method":
                  "SportPulse Monte Carlo projection using current winning percentage, remaining schedule, and home-field advantage.",

              "playoffTargets": {

                  "AL":
                      targets[103],

                  "NL":
                      targets[104]

              },

              "teams":
                  results

          }


          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/playoff_odds.json",
              "w",
              encoding="utf-8"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2
              )


          # =========================================
          # FINAL CHECK
          # =========================================

          print("")
          print(
              "================================"
          )

          print(
              "PLAYOFF ODDS COMPLETE"
          )

          print(
              "Simulations:",
              SIMULATIONS
          )

          print(
              "Teams:",
              len(results)
          )

          print(
              "AL Target:",
              targets[103]
          )

          print(
              "NL Target:",
              targets[104]
          )

          print(
              "================================"
          )


          if len(results) != 30:

              raise RuntimeError(
                  "Playoff odds file does not "
                  "contain 30 teams."
              )


          PY


      - name: Save playoff odds
        run: |

          git config user.name "SportPulse Bot"

          git config user.email "sportpulse-bot@users.noreply.github.com"

          git add data/playoff_odds.json

          if git diff --cached --quiet; then

            echo "No changes to commit"

          else

            git commit -m "Update MLB playoff odds"

            git push

          fi
