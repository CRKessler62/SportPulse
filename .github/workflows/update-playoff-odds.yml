name: Update MLB Playoff Odds

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  playoff-odds:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Calculate MLB Playoff Odds
        run: |

          python3 <<'PY'

          import json
          import urllib.request
          import urllib.parse
          import random
          import os
          from datetime import datetime, timezone


          SEASON = 2026

          SIMULATIONS = 10000


          # =========================================
          # MLB API HELPER
          # =========================================

          def get_api(url):

              request = urllib.request.Request(

                  url,

                  headers={
                      "User-Agent":
                      "SportPulse/1.0"
                  }

              )

              with urllib.request.urlopen(
                  request,
                  timeout=60
              ) as response:

                  return json.load(response)


          # =========================================
          # GET CURRENT STANDINGS
          # =========================================

          teams = {}


          for league_id in [103, 104]:

              standings_url = (
                  "https://statsapi.mlb.com/api/v1/standings?"
                  "leagueId="
                  + str(league_id)
                  +
                  "&season="
                  + str(SEASON)
                  +
                  "&standingsTypes=regularSeason"
              )


              print(
                  "Loading standings for league:",
                  league_id
              )


              standings_data =
                  get_api(
                      standings_url
                  )


              for record in standings_data.get(
                  "records",
                  []
              ):

                  division =
                      record.get(
                          "division",
                          {}
                      )


                  division_id =
                      division.get(
                          "id"
                      )


                  division_name =
                      division.get(
                          "nameShort",
                          ""
                      )


                  for team_record in record.get(
                      "teamRecords",
                      []
                  ):

                      team =
                          team_record.get(
                              "team",
                              {}
                          )


                      team_id =
                          team.get(
                              "id"
                          )


                      if not team_id:
                          continue


                      wins =
                          int(
                              team_record.get(
                                  "wins",
                                  0
                              )
                          )


                      losses =
                          int(
                              team_record.get(
                                  "losses",
                                  0
                              )
                          )


                      games_played =
                          wins + losses


                      if games_played > 0:

                          win_pct =
                              wins / games_played

                      else:

                          win_pct =
                              0.500


                      teams[team_id] = {

                          "id":
                              team_id,

                          "name":
                              team.get(
                                  "name",
                                  "Unknown"
                              ),

                          "leagueId":
                              league_id,

                          "divisionId":
                              division_id,

                          "division":
                              division_name,

                          "wins":
                              wins,

                          "losses":
                              losses,

                          "winPct":
                              win_pct,

                          "remaining":
                              0

                      }


          print(
              "Teams loaded:",
              len(teams)
          )


          if len(teams) != 30:

              raise Exception(
                  "Expected 30 MLB teams but found "
                  + str(len(teams))
              )


          # =========================================
          # GET REMAINING SCHEDULE
          # =========================================

          today =
              datetime.now(
                  timezone.utc
              ).strftime(
                  "%Y-%m-%d"
              )


          schedule_url = (
              "https://statsapi.mlb.com/api/v1/schedule?"
              "sportId=1"
              "&startDate="
              + today
              +
              "&endDate=2026-10-04"
              "&gameTypes=R"
              "&hydrate=team"
          )


          print(
              "Loading remaining schedule..."
          )


          schedule_data =
              get_api(
                  schedule_url
              )


          remaining_games = []


          for date in schedule_data.get(
              "dates",
              []
          ):

              for game in date.get(
                  "games",
                  []
              ):

                  status =
                      game.get(
                          "status",
                          {}
                      )


                  abstract_state =
                      status.get(
                          "abstractGameState",
                          ""
                      )


                  # Ignore completed games.

                  if abstract_state == "Final":

                      continue


                  game_teams =
                      game.get(
                          "teams",
                          {}
                      )


                  away =
                      game_teams.get(
                          "away",
                          {}
                      ).get(
                          "team",
                          {}
                      ).get(
                          "id"
                      )


                  home =
                      game_teams.get(
                          "home",
                          {}
                      ).get(
                          "team",
                          {}
                      ).get(
                          "id"
                      )


                  if (
                      away not in teams
                      or
                      home not in teams
                  ):

                      continue


                  remaining_games.append({

                      "away":
                          away,

                      "home":
                          home

                  })


                  teams[away]["remaining"] += 1

                  teams[home]["remaining"] += 1


          print(
              "Remaining games:",
              len(remaining_games)
          )


          # =========================================
          # WIN PROBABILITY
          # =========================================

          def home_win_probability(
              away_id,
              home_id
          ):

              away_pct =
                  teams[
                      away_id
                  ]["winPct"]


              home_pct =
                  teams[
                      home_id
                  ]["winPct"]


              # Difference in team strength.

              difference =
                  home_pct - away_pct


              probability =
                  0.500 + (
                      difference * 0.85
                  )


              # Home-field advantage.

              probability += 0.025


              # Prevent ridiculous probabilities.

              if probability < 0.20:

                  probability = 0.20


              if probability > 0.80:

                  probability = 0.80


              return probability


          # =========================================
          # RESULT STORAGE
          # =========================================

          playoff_count = {

              team_id: 0

              for team_id in teams

          }


          division_count = {

              team_id: 0

              for team_id in teams

          }


          wildcard_count = {

              team_id: 0

              for team_id in teams

          }


          simulated_wins = {

              team_id: []

              for team_id in teams

          }


          playoff_cutoffs = {

              103: [],

              104: []

          }


          # =========================================
          # RUN SIMULATIONS
          # =========================================

          print(
              "Running",
              SIMULATIONS,
              "simulations..."
          )


          for simulation in range(
              SIMULATIONS
          ):


              wins = {

                  team_id:
                      team["wins"]

                  for team_id, team
                  in teams.items()

              }


              # -----------------------------
              # SIMULATE EVERY REMAINING GAME
              # -----------------------------

              for game in remaining_games:

                  away =
                      game["away"]


                  home =
                      game["home"]


                  probability =
                      home_win_probability(
                          away,
                          home
                      )


                  if random.random() < probability:

                      wins[home] += 1

                  else:

                      wins[away] += 1


              # -----------------------------
              # FIND DIVISION WINNERS
              # -----------------------------

              division_winners = set()


              division_ids = set(

                  team["divisionId"]

                  for team in teams.values()

              )


              for division_id in division_ids:

                  division_teams = [

                      team_id

                      for team_id, team
                      in teams.items()

                      if team["divisionId"]
                      == division_id

                  ]


                  if not division_teams:

                      continue


                  # Sort by simulated wins.

                  division_teams.sort(

                      key=lambda team_id:
                          wins[team_id],

                      reverse=True

                  )


                  winner =
                      division_teams[0]


                  division_winners.add(
                      winner
                  )


                  division_count[
                      winner
                  ] += 1


              # -----------------------------
              # FIND WILD CARD TEAMS
              # -----------------------------

              playoff_teams =
                  set(
                      division_winners
                  )


              for league_id in [
                  103,
                  104
              ]:


                  league_teams = [

                      team_id

                      for team_id, team
                      in teams.items()

                      if team["leagueId"]
                      == league_id

                      and
                      team_id
                      not in division_winners

                  ]


                  league_teams.sort(

                      key=lambda team_id:
                          wins[team_id],

                      reverse=True

                  )


                  wildcard_teams =
                      league_teams[:3]


                  # Store the lowest playoff
                  # win total for this league.

                  all_playoff_teams = [

                      team_id

                      for team_id in
                      playoff_teams

                      if teams[
                          team_id
                      ]["leagueId"]
                      == league_id

                  ]


                  all_playoff_teams += \
                      wildcard_teams


                  if all_playoff_teams:

                      cutoff =
                          min(

                              wins[
                                  team_id
                              ]

                              for team_id
                              in all_playoff_teams

                          )


                      playoff_cutoffs[
                          league_id
                      ].append(
                          cutoff
                      )


                  for team_id in wildcard_teams:

                      playoff_teams.add(
                          team_id
                      )


                      wildcard_count[
                          team_id
                      ] += 1


              # -----------------------------
              # COUNT PLAYOFF APPEARANCES
              # -----------------------------

              for team_id in playoff_teams:

                  playoff_count[
                      team_id
                  ] += 1


              # -----------------------------
              # SAVE SIMULATED WINS
              # -----------------------------

              for team_id in teams:

                  simulated_wins[
                      team_id
                  ].append(
                      wins[team_id]
                  )


          # =========================================
          # MEDIAN FUNCTION
          # =========================================

          def median(values):

              if not values:

                  return 0


              values =
                  sorted(
                      values
                  )


              middle =
                  len(values) // 2


              if len(values) % 2:

                  return values[
                      middle
                  ]


              return (

                  values[
                      middle - 1
                  ]

                  +

                  values[
                      middle
                  ]

              ) / 2


          # =========================================
          # PLAYOFF CUTOFFS
          # =========================================

          playoff_targets = {}


          for league_id in [
              103,
              104
          ]:

              playoff_targets[
                  league_id
              ] = round(

                  median(
                      playoff_cutoffs[
                          league_id
                      ]
                  )

              )


          print(
              "AL projected playoff line:",
              playoff_targets[103]
          )


          print(
              "NL projected playoff line:",
              playoff_targets[104]
          )


          # =========================================
          # BUILD RESULTS
          # =========================================

          results = []


          for team_id, team in teams.items():

              playoff_probability = (

                  playoff_count[
                      team_id
                  ]

                  /

                  SIMULATIONS

                  *

                  100

              )


              division_probability = (

                  division_count[
                      team_id
                  ]

                  /

                  SIMULATIONS

                  *

                  100

              )


              wildcard_probability = (

                  wildcard_count[
                      team_id
                  ]

                  /

                  SIMULATIONS

                  *

                  100

              )


              miss_probability = (

                  100 -
                  playoff_probability

              )


              average_wins = (

                  sum(
                      simulated_wins[
                          team_id
                      ]
                  )

                  /

                  len(
                      simulated_wins[
                          team_id
                      ]
                  )

              )


              average_wins =
                  round(
                      average_wins,
                      1
                  )


              league_target =
                  playoff_targets[
                      team["leagueId"]
                  ]


              wins_needed = max(

                  0,

                  league_target -
                  team["wins"]

              )


              remaining =
                  team["remaining"]


              # =================================
              # STATUS
              # =================================

              if playoff_probability >= 90:

                  status =
                      "Very strong position"

              elif playoff_probability >= 75:

                  status =
                      "Strong position"

              elif playoff_probability >= 50:

                  status =
                      "Likely in the hunt"

              elif playoff_probability >= 25:

                  status =
                      "Bubble team"

              elif playoff_probability >= 5:

                  status =
                      "Long shot"

              else:

                  status =
                      "Very unlikely"


              # =================================
              # WHAT THEY NEED
              # =================================

              if playoff_probability >= 90:

                  what_they_need = (

                      "Maintain their current pace "
                      "and avoid a major collapse."

                  )

              elif wins_needed == 0:

                  what_they_need = (

                      "They are currently above the "
                      "projected playoff win line. "
                      "The goal is to maintain their position."

                  )

              elif remaining == 0:

                  what_they_need = (

                      "The regular season is complete."

                  )

              elif wins_needed >= remaining:

                  what_they_need = (

                      "They would need to win "
                      "almost every remaining game "
                      "to reach the projected playoff line."

                  )

              else:

                  what_they_need = (

                      "They need approximately "

                      +
                      str(wins_needed)

                      +

                      " more wins to reach the "
                      "current projected playoff line."

                  )


              results.append({

                  "teamId":
                      team_id,

                  "team":
                      team["name"],

                  "league":
                      (
                          "AL"
                          if team["leagueId"] == 103
                          else "NL"
                      ),

                  "division":
                      team["division"],

                  "wins":
                      team["wins"],

                  "losses":
                      team["losses"],

                  "gamesRemaining":
                      remaining,

                  "playoffProbability":
                      round(
                          playoff_probability,
                          1
                      ),

                  "divisionProbability":
                      round(
                          division_probability,
                          1
                      ),

                  "wildCardProbability":
                      round(
                          wildcard_probability,
                          1
                      ),

                  "missProbability":
                      round(
                          miss_probability,
                          1
                      ),

                  "projectedWins":
                      average_wins,

                  "projectedPlayoffTarget":
                      league_target,

                  "winsNeeded":
                      wins_needed,

                  "status":
                      status,

                  "whatTheyNeed":
                      what_they_need

              })


          # =========================================
          # SORT BY LEAGUE THEN PLAYOFF ODDS
          # =========================================

          results.sort(

              key=lambda team: (

                  team["league"],

                  -team[
                      "playoffProbability"
                  ]

              )

          )


          # =========================================
          # CREATE OUTPUT
          # =========================================

          output = {

              "season":
                  SEASON,

              "lastUpdated":
                  datetime.now(
                      timezone.utc
                  ).isoformat(),

              "simulationCount":
                  SIMULATIONS,

              "method":
                  "Monte Carlo simulation using current team winning percentage, remaining schedule, and home-field advantage.",

              "playoffTargets": {

                  "AL":
                      playoff_targets[103],

                  "NL":
                      playoff_targets[104]

              },

              "teams":
                  results

          }


          # =========================================
          # SAVE FILE
          # =========================================

          os.makedirs(
              "data",
              exist_ok=True
          )


          with open(
              "data/playoff_odds.json",
              "w"
          ) as file:

              json.dump(
                  output,
                  file,
                  indent=2
              )


          # =========================================
          # VALIDATION
          # =========================================

          print("")
          print(
              "======================================"
          )

          print(
              "PLAYOFF ODDS COMPLETE"
          )

          print(
              "Simulations:",
              SIMULATIONS
          )

          print(
              "Teams:",
              len(results)
          )

          print(
              "AL Target:",
              playoff_targets[103]
          )

          print(
              "NL Target:",
              playoff_targets[104]
          )

          print(
              "======================================"
          )


          if len(results) != 30:

              raise Exception(
                  "Expected 30 teams in playoff odds."
              )


          PY


      - name: Save playoff odds
        run: |

          git config user.name \
            "SportPulse Bot"

          git config user.email \
            "sportpulse-bot@users.noreply.github.com"

          git add data/playoff_odds.json

          git diff --cached --quiet || \
            git commit -m \
            "Update MLB playoff odds"

          git push
